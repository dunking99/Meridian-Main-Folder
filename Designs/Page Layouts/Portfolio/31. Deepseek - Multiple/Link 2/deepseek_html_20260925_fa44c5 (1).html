<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meridian · Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --sea:#17394a;--panel-a:rgba(38,82,103,.5);--panel-b:rgba(19,52,68,.5);
  --line:rgba(178,220,232,.12);--line2:rgba(178,220,232,.22);
  --foam:#e9f4f6;--mist:#a9c6cf;--dim:#7796a3;
  --accent:#9d8cff;--accent-2:rgba(157,140,255,.15);
  --gain:#3fd39b;--loss:#ff7a68;
  --display:'Quicksand',system-ui,sans-serif;--text:'Nunito Sans',system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;display:flex;height:100vh;overflow:hidden;background:var(--sea);color:var(--foam);
  font-family:var(--text);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:rgba(157,140,255,.35)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(178,220,232,.16);border-radius:8px;border:4px solid transparent;background-clip:content-box}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.rail{width:344px;flex:0 0 344px;height:100%;overflow-y:auto;overflow-x:hidden;
  background:radial-gradient(120% 42% at 50% -6%, rgba(157,140,255,.22), transparent 62%),
    radial-gradient(90% 34% at 50% 108%, rgba(79,196,216,.10), transparent 60%),
    linear-gradient(180deg,#0f2b38 0%,#0a2029 62%,#07181e 100%);
  border-right:1px solid var(--line);padding:22px 20px 20px;display:flex;flex-direction:column;gap:16px;position:relative}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:26px;height:26px;color:var(--accent);flex:0 0 auto}
.brand-name{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.26em;text-transform:uppercase;line-height:1}
.brand-sub{font-size:10.5px;color:var(--dim);letter-spacing:.03em;margin-top:3px}
.microlabel{font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.hero{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.hero-val{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.02;letter-spacing:-.015em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(157,140,255,.28)}
.hero-delta{display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hero-delta .abs{color:var(--dim);font-weight:600;font-size:11px}
.trace{height:66px;margin:8px -4px 0;position:relative}
.trace svg{display:block;width:100%;height:100%}
.trace-cap{font-size:9.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;text-align:right;margin-top:-2px}
.cur-switch{display:flex;background:rgba(8,25,31,.55);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.cur-switch button{flex:1;padding:7px 0;border-radius:8px;font-size:10.5px;font-weight:700;letter-spacing:.11em;
  color:var(--dim);transition:color .16s,background .16s}
.cur-switch button:hover{color:var(--mist)}
.cur-switch button.on{background:var(--accent-2);color:#cdc4ff;box-shadow:inset 0 0 0 1px rgba(157,140,255,.32)}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;font-size:12.5px;
  font-weight:600;color:var(--mist);position:relative;transition:background .16s,color .16s;cursor:pointer}
.nav a svg{width:15px;height:15px;flex:0 0 auto;opacity:.75;pointer-events:none}
.nav a:hover{background:rgba(178,220,232,.06);color:var(--foam)}
.nav a.on{background:var(--accent-2);color:#d3cbff}
.nav a.on svg{opacity:1;color:var(--accent)}
.nav a.on::before{content:'';position:absolute;left:-20px;top:50%;transform:translateY(-50%);width:3px;
  height:18px;border-radius:0 3px 3px 0;background:var(--accent);box-shadow:0 0 12px rgba(157,140,255,.8);pointer-events:none}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.pulse{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--mist)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gain);box-shadow:0 0 8px var(--gain);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.rail-time{font-size:10px;color:var(--dim);letter-spacing:.04em;font-variant-numeric:tabular-nums}

.main{flex:1;height:100vh;overflow-y:auto;position:relative;
  background:radial-gradient(75% 34% at 22% -6%, rgba(157,140,255,.11), transparent 62%),
    linear-gradient(180deg,#1a4152 0%,#163a4b 44%,#11303e 100%)}
.page{padding:26px 30px 70px;max-width:1560px;margin:0 auto}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px;flex-wrap:wrap}
.kicker{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;margin:0 0 7px;letter-spacing:-.012em}
.sub{margin:0;color:var(--mist);font-size:12.5px;max-width:56ch;line-height:1.5}
.asof{font-size:10.5px;color:var(--dim);letter-spacing:.05em;font-variant-numeric:tabular-nums;text-align:right}
.phead-tools{display:flex;gap:10px;align-items:center}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}
.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}
.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
.card{background:linear-gradient(180deg,var(--panel-a),var(--panel-b));border:1px solid var(--line);
  border-radius:16px;padding:16px 18px 18px;position:relative}
.card::before{content:'';position:absolute;top:-1px;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(200,235,245,.18),transparent)}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.ch h2{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.005em;margin:0}
.ch-note{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:400;letter-spacing:.02em}
.ch-r{display:flex;align-items:center;gap:10px}
.pills{display:flex;gap:2px;background:rgba(8,25,31,.5);border:1px solid var(--line);border-radius:9px;padding:3px}
.pills button{padding:5px 11px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);transition:.15s}
.pills button:hover{color:var(--mist)}
.pills button.on{background:var(--accent-2);color:#cdc4ff}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend span{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mist);letter-spacing:.05em}
.swatch{width:14px;height:2px;border-radius:2px;display:inline-block}
.swatch.dotr{width:7px;height:7px;border-radius:50%}
.chart-wrap{position:relative;width:100%}
.chart-wrap svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(6,20,26,.94);
  border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:11px;line-height:1.5;
  min-width:140px;box-shadow:0 14px 32px rgba(0,0,0,.45);z-index:20;backdrop-filter:blur(6px)}
.tip.on{opacity:1}
.tip .tt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700}
.tip .tr{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}
.ftip{position:fixed;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100;
  background:rgba(6,20,26,.95);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;
  font-size:11px;line-height:1.5;min-width:130px;box-shadow:0 14px 32px rgba(0,0,0,.5)}
.ftip.on{opacity:1}
.ftip .tt{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px;font-weight:700}
.ftip .tr{display:flex;justify-content:space-between;gap:16px;font-variant-numeric:tabular-nums}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:52px 1fr 74px;align-items:center;gap:8px;height:25px;position:relative}
.row .rl{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--mist);font-variant-numeric:tabular-nums}
.row .rt{position:relative;height:11px}
.row .rt .axis{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.row .rt .bar{position:absolute;top:1px;height:9px;border-radius:3px;transition:filter .14s}
.row .rt .bar.g{background:linear-gradient(90deg,rgba(63,211,155,.45),var(--gain))}
.row .rt .bar.l{background:linear-gradient(90deg,var(--loss),rgba(255,122,104,.45))}
.row .rv{text-align:right;font-size:11px;font-variant-numeric:tabular-nums;font-weight:700}

.exp{display:flex;flex-direction:column;gap:13px}
.exp-row{display:flex;flex-direction:column;gap:6px}
.exp-head{display:flex;justify-content:space-between;align-items:baseline}
.exp-head .t{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.exp-head .n{font-size:10px;color:var(--dim);letter-spacing:.03em}
.stack{height:15px;display:flex;border-radius:5px;overflow:hidden;gap:2px}
.stack div{transition:filter .14s}
.exp-legend{display:flex;flex-wrap:wrap;gap:4px 13px;margin-top:1px}
.exp-legend span{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mist)}
.exp-legend i{width:7px;height:7px;border-radius:2px;display:block}

.signals{display:flex;flex-direction:column}
.sig{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.sig:first-child{border-top:none;padding-top:2px}
.sig-i{width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
  background:rgba(157,140,255,.13);color:var(--accent);font-size:11px;font-weight:800}
.sig-i.g{background:rgba(63,211,155,.13);color:var(--gain)}
.sig-i.r{background:rgba(255,122,104,.13);color:var(--loss)}
.sig-t{font-size:11.5px;line-height:1.5;color:var(--mist)}
.sig-t b{color:var(--foam);font-weight:700}
.sig-t em{font-style:normal;color:var(--dim)}

.reef-wrap{position:relative}
.tile{transition:filter .15s;cursor:pointer}
.tile:hover{filter:brightness(1.22)}
.tile-label{font-family:var(--text);font-weight:800;pointer-events:none}
.tile-sub{font-family:var(--text);font-weight:600;pointer-events:none;opacity:.72}
.grp-label{font-family:var(--text);font-weight:800;font-size:9px;letter-spacing:.16em;text-transform:uppercase;pointer-events:none}

.htable{width:100%;border-collapse:collapse;font-size:12.5px}
.htable th{text-align:right;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--dim);padding:0 9px 9px;cursor:pointer;user-select:none;white-space:nowrap}
.htable th:first-child{text-align:left;padding-left:2px}
.htable th:hover{color:var(--mist)}
.htable th.sorted{color:var(--accent)}
.htable th.sorted::after{content:' \25BE';font-size:8px}
.htable th.sorted.asc::after{content:' \25B4'}
.htable td{padding:9px 9px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.htable td:first-child{text-align:left;padding-left:2px}
.htable tbody tr{cursor:pointer;transition:background .14s}
.htable tbody tr:hover{background:rgba(157,140,255,.075)}
.htable tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
.htable tfoot td{border-top:1px solid var(--line2);font-weight:800;padding-top:12px;color:var(--foam)}
.hcell{display:flex;align-items:center;gap:10px}
.htick{font-family:var(--display);font-weight:700;font-size:12.5px;line-height:1.15}
.hname{font-size:10px;color:var(--dim);line-height:1.2}
.wbar{height:5px;border-radius:3px;background:rgba(178,220,232,.13);position:relative;overflow:hidden;min-width:56px}
.wbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,rgba(157,140,255,.5),var(--accent))}
.wcell{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.wcell span{font-size:11px}
.gain{color:var(--gain)}.loss{color:var(--loss)}.flat{color:var(--mist)}

.srow{display:grid;grid-template-columns:150px 1fr 62px 62px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:none;padding-top:2px}
.slabel{font-size:11.5px;font-weight:700;color:var(--foam);line-height:1.25}
.slabel em{display:block;font-style:normal;font-weight:400;font-size:9.5px;color:var(--dim);letter-spacing:.05em;margin-top:2px}
.srail{position:relative;height:14px}
.srail .track{position:absolute;left:0;right:0;top:6px;height:2px;background:rgba(178,220,232,.11);border-radius:2px}
.srail .bmb{position:absolute;top:4px;height:6px;border-radius:3px;background:rgba(127,162,179,.3)}
.srail .mk{position:absolute;top:0;width:3px;height:14px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(157,140,255,.8)}
.sval{text-align:right;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.sverdict{text-align:right;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.sverdict.warn{color:var(--loss)}.sverdict.ok{color:var(--gain)}

.cond{display:flex;flex-direction:column}
.verdict{font-family:var(--display);font-size:15px;font-weight:600;line-height:1.45;color:var(--foam);
  padding:2px 0 14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.verdict em{font-style:normal;color:var(--accent)}
.cline{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.cline:last-child{border-bottom:none}
.ctag{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 0;color:var(--dim)}
.ctag.act{color:var(--loss)}.ctag.watch{color:#e8b45f}.ctag.steady{color:var(--gain)}
.ctext{font-size:11.5px;line-height:1.55;color:var(--mist)}
.ctext b{color:var(--foam);font-weight:700}

.stress{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.stress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.stress-head .t{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:3px;
  background:linear-gradient(90deg,var(--loss),rgba(255,122,104,.15));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);cursor:grab;box-shadow:0 0 0 4px rgba(157,140,255,.18),0 0 14px rgba(157,140,255,.6)}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--accent);cursor:grab}
.stress-out{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;font-variant-numeric:tabular-nums}
.stress-out .big{font-family:var(--display);font-size:22px;font-weight:600;color:var(--loss)}
.stress-out .sm{font-size:10.5px;color:var(--dim);text-align:right;line-height:1.5}

.hd-price{font-family:var(--display);font-size:40px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.015em}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--mist);
  background:rgba(178,220,232,.07);border:1px solid var(--line);padding:4px 9px;border-radius:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:14px 20px}
.fact{display:flex;flex-direction:column;gap:4px}
.fact .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.fact .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--display)}
.fact .v small{font-size:10px;color:var(--dim);font-weight:600;font-family:var(--text);letter-spacing:.02em;margin-left:5px}

.drift{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:110px 1fr 96px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.drow:first-child{border-top:none;padding-top:2px}
.dname{font-size:11.5px;font-weight:700}
.dtrack{position:relative;height:16px}
.dtrack .base{position:absolute;left:50%;top:2px;bottom:2px;width:1px;background:var(--line2)}
.dtrack .b{position:absolute;top:5px;height:6px;border-radius:3px}
.dval{text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--mist)}
.dval b{font-weight:800}

.peer-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.peer-row:hover{background:rgba(157,140,255,.06)}
.peer-name{font-size:11.5px;font-weight:700}
.peer-name span{color:#7796a3;font-weight:400;margin-left:8px}
.peer-val{font-size:11.5px;font-variant-numeric:tabular-nums}

#errorBanner{position:fixed;bottom:0;left:0;right:0;background:#ff7a68;color:#08191f;
  padding:8px 12px;font:12px/1.4 monospace;z-index:99999;max-height:140px;overflow:auto;
  box-shadow:0 -4px 20px rgba(0,0,0,.4)}

@media (max-width:1180px){.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}}
@media (max-width:900px){
  body{flex-direction:column;overflow:auto;height:auto}
  .rail{width:100%;flex:0 0 auto;height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--line)}
  .rail-foot{display:none}.trace{display:none}
  .nav{flex-direction:row;flex-wrap:wrap}.nav a.on::before{display:none}
  .main{height:auto;overflow:visible}.page{padding:20px 16px 60px}h1{font-size:27px}
}
</style>
</head>
<body>

<aside class="rail">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9.3" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/>
      <ellipse cx="12" cy="12" rx="4.2" ry="9.3" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".85"/>
      <line x1="2.7" y1="12" x2="21.3" y2="12" stroke="currentColor" stroke-width="1" opacity=".3"/>
      <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
    </svg>
    <div>
      <div class="brand-name">Meridian</div>
      <div class="brand-sub">Personal portfolio · GBP base</div>
    </div>
  </div>

  <div class="hero">
    <div class="microlabel">Total value</div>
    <div class="hero-val" id="railValue">&mdash;</div>
    <div class="hero-delta" id="railDelta">&mdash;</div>
    <div class="trace" id="railTrace"></div>
    <div class="trace-cap">30-day trace</div>
  </div>

  <div class="cur-switch" id="curSwitch" role="group" aria-label="Display currency">
    <button type="button" data-ccy="GBP" class="on">GBP</button>
    <button type="button" data-ccy="USD">USD</button>
    <button type="button" data-ccy="EUR">EUR</button>
  </div>

  <nav class="nav" id="nav">
    <a href="#/overview" data-nav="overview">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M1.5 12.5h13"/><path d="M3.6 12.5a4.4 4.4 0 0 1 8.8 0"/><circle cx="8" cy="6.2" r="1.6"/></svg>
      Overview</a>
    <a href="#/holdings" data-nav="holdings">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h7M2 8h12M2 12h5"/><circle cx="12" cy="4" r="1.6"/><circle cx="10" cy="12" r="1.6"/></svg>

function buildSeries(mults,endValue,seed){
  var rnd=mulberry32(seed), N=366, anchors=[0];
  for(var m=1;m<=12;m++) anchors.push(Math.round(m*365/12));
  anchors[12]=365;
  var cum=[1]; for(var i=0;i<mults.length;i++) cum.push(cum[cum.length-1]*mults[i]);
  var base=endValue/cum[12], out=new Array(N); out[0]=base;
  for(var s=0;s<12;s++){
    var a=anchors[s], b=anchors[s+1], va=base*cum[s], vb=base*cum[s+1], steps=b-a;
    var walk=0, ws=[0];
    for(var k=1;k<=steps;k++){ walk+=(rnd()-0.5)*2*0.0078; ws.push(walk); }
    for(var k2=1;k2<=steps;k2++){
      var t=k2/steps, bridged=ws[k2]-ws[steps]*t;
      out[a+k2]=va+(vb-va)*t+va*bridged;
    }
  }
  out[365]=endValue; out[364]=endValue-DAYPNL;
  return out;
}

function priceSeries(h){

  for(var i=1;i<n;i++){ acc+=(rnd()-0.5)*0.03; w.push(acc); }

    var base=p0*Math.pow(h.px/p0, j/(n-1));
    out[j]=base*Math.exp(w[j]-wEnd*j/(n-1));

  out[n-1]=h.px; return out;
}

function reefRGB(day){
  if(day === 0) return [58,95,112];
  var t = clamp(Math.abs(day)/3, 0, 1);
  var base = day > 0 ? [63,211,155] : [255,122,104];
  var neu  = [46,84,102];
  var out = [];
  for(var i=0;i<3;i++) out.push(Math.round(neu[i]+(base[i]-neu[i])*(0.28+0.72*t)));
  return out;
}
function inkFor(rgb){
  var l = (0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2])/255;
  return l > 0.58 ? '#08202a' : '#eef7f8';
}
function squarify(items, x, y, w, h, out){
  var i = 0, cx = x, cy = y, cw = w, ch = h;
  while(i < items.length){
    var side = Math.min(cw,ch);
    var totalV = 0;
    for(var t=i;t<items.length;t++) totalV += items[t].v;
    if(totalV <= 0) return;
    var scale = (cw*ch)/totalV;
    var rowArea = 0, row = [], best = Infinity, j = i;
    while(j < items.length){
      var a = items[j].v * scale, newArea = rowArea + a;
      var mx = 0, mn = Infinity;
      for(var q=i;q<=j;q++){ var aa = items[q].v * scale; if(aa>mx) mx=aa; if(aa<mn) mn=aa; }
      var wr = Math.max((side*side*mx)/(newArea*newArea), (newArea*newArea)/(side*side*(mn||0.0001)));
      if(wr <= best + 1e-9){ best = wr; rowArea = newArea; row.push(items[j]); j++; }
      else break;
    }
    if(!row.length){ row=[items[i]]; rowArea = items[i].v*scale; j = i+1; }
    var thickness = rowArea/side;
    if(cw >= ch){
      var oy = cy;
      for(var r1=0;r1<row.length;r1++){ var hh = (row[r1].v*scale)/thickness; out.push({item:row[r1], x:cx, y:oy, w:thickness, h:hh}); oy += hh; }
      cx += thickness; cw -= thickness;
    }else{
      var ox = cx;
      for(var r2=0;r2<row.length;r2++){ var ww = (row[r2].v*scale)/thickness; out.push({item:row[r2], x:ox, y:cy, w:ww, h:thickness}); ox += ww; }
      cy += thickness; ch -= thickness;
    }
    i = j;
  }
}
function drawReef(){
  var wrap = el('reefWrap'); if(!wrap) return;
  var W = wrap.clientWidth || 700, H = wrap.clientHeight || 322;
  if(W < 50) return;
  var groups = {};
  for(var i=0;i<HOLDINGS.length;i++){
    var h = HOLDINGS[i];
    var key = h.cash ? 'Cash' : (h.sec === 'Diversified' ? 'Funds' : h.sec);
    if(!groups[key]) groups[key] = [];
    groups[key].push(h);
  }
  var gItems = [];
  for(var k in groups){ if(groups.hasOwnProperty(k)){
    var sum = 0; for(var s=0;s<groups[k].length;s++) sum += gbp(groups[k][s]);
    gItems.push({ k:k, v:sum });
  }}
  gItems.sort(function(a,b){ return b.v - a.v; });
  var gRects = [];
  squarify(gItems, 0, 0, W, H, gRects);

  var svg = '';
  for(var gi=0; gi<gRects.length; gi++){
    var gr = gRects[gi];
    var pad = 3, hasLabel = gr.h > 62 && gr.w > 92;
    var bx = gr.x + pad, by = gr.y + (hasLabel ? 15 : pad);
    var bw = gr.w - pad*2, bh = gr.h - (hasLabel ? 15 : pad) - pad;
    if(bw <= 0 || bh <= 0) continue;
    if(hasLabel){
      svg += '<text class="grp-label" x="'+(gr.x+4)+'" y="'+(gr.y+11)+'" fill="#7796a3">'+gr.item.k+'</text>';
    }
    var kids = [];
    for(var ki=0;ki<groups[gr.item.k].length;ki++){
      var hh2 = groups[gr.item.k][ki];
      kids.push({ h:hh2, v:gbp(hh2) });
    }
    kids.sort(function(a,b){ return b.v - a.v; });
    var rects = [];
    squarify(kids, bx, by, bw, bh, rects);
    for(var ri=0; ri<rects.length; ri++){
      var r = rects[ri];
      var hd = r.item.h, gap = 2;
      var rx = r.x + gap/2, ry = r.y + gap/2;
      var rw = Math.max(r.w - gap, 0.5), rh = Math.max(r.h - gap, 0.5);
      var fill, ink = '#eef7f8', dash = '';
      if(hd.cash){ fill = '#22414f'; ink = '#a9c6cf'; dash = ' stroke-dasharray="3 3" stroke="rgba(178,220,232,.35)"'; }
      else { var rgb = reefRGB(hd.day); fill = 'rgb('+rgb.join(',')+')'; ink = inkFor(rgb); }
      svg += '<rect class="tile" data-t="'+hd.t+'" data-nav="holding" data-nav-arg="'+hd.t+'" x="'+rx.toFixed(1)+'" y="'+ry.toFixed(1)+'" width="'+rw.toFixed(1)+'" height="'+rh.toFixed(1)+'" rx="4.5" fill="'+fill+'"'+dash+'/>';
      if(rw > 50 && rh > 27){
        svg += '<text class="tile-label" x="'+(rx+rw/2).toFixed(1)+'" y="'+(ry+rh/2+(rh>44?-1:4)).toFixed(1)+'" fill="'+ink+'" font-size="11" text-anchor="middle">'+hd.t+'</text>';
        if(rh > 42){
          svg += '<text class="tile-sub" x="'+(rx+rw/2).toFixed(1)+'" y="'+(ry+rh/2+13).toFixed(1)+'" fill="'+ink+'" font-size="9.5" text-anchor="middle">'+(gbp(hd)/TOTAL*100).toFixed(1)+'%</text>';
        }
      }
    }
  }
  wrap.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+svg+'</svg>';

  var ftip = el('ftip');
  qsa('.tile', wrap).forEach(function(rect){
    rect.addEventListener('pointerenter', function(){
      var h = findHolding(rect.getAttribute('data-t')); if(!h) return;

      ftip.innerHTML = '<div class="tt">'+h.t+' · '+h.sec+'</div>'+
        '<div class="tr"><span>Value</span><b>'+money(dv(gbp(h)),0)+'</b></div>'+
        '<div class="tr"><span>Weight</span><b>'+WEIGHT(h).toFixed(2)+'%</b></div>'+
        '<div class="tr"><span>Today</span><b class="'+tone(h.day)+'">'+sign(h.day,2)+'</b></div>'+
        '<div class="tr"><span>Since cost</span><b class="'+tone(g)+'">'+sign(g,1)+'</b></div>';

function stackHTML(obj, limit){
  var ent = [];
  for(var k in obj){ if(obj.hasOwnProperty(k)) ent.push([k, obj[k]]); }
  ent.sort(function(a,b){ return b[1] - a[1]; });
  var top = ent.slice(0, limit);
  var rest = 0; for(var i=limit;i<ent.length;i++) rest += ent[i][1];
  if(rest > 0) top.push(['Other', rest]);
  var total = 0; for(var j=0;j<ent.length;j++) total += ent[j][1];
  var bar = '', leg = '';
  for(var m=0;m<top.length;m++){
    var e = top[m], pc = e[1]/total*100;
    var col = e[0] === 'Diversified' ? '#5d7f92' : PAL[m % PAL.length];

  }
  return { bar:bar, leg:leg };

    var pts = '';
    for(var pj=0; pj<sp.length; pj++){

      '<td><div class="wcell"><span>'+wgt.toFixed(1)+'%</span><div class="wbar" style="width:62px"><i style="width:'+(wgt/maxW*100).toFixed(1)+'%"></i></div></div></td>'+
      '<td class="'+tone(h.day)+'">'+(h.cash ? '\u2014' : sign(h.day,1))+'</td></tr>';
  }

  var shown = 0, shownGain = 0;
  for(var sj=0;sj<rows.length;sj++){ shown += gbp(rows[sj]); shownGain += (gbp(rows[sj]) - gbpCost(rows[sj])); }

  wrap.innerHTML = '<table class="htable"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody>'+
    '<tfoot><tr><td>'+rows.length+' positions</td><td></td><td>'+money(dv(shown),0)+'</td>'+
    '<td class="'+tone(shownGain)+'">'+(shownGain>=0?'+':'\u2212')+money(dv(Math.abs(shownGain)),0)+'</td>'+
    '<td>'+(shown/TOTAL*100).toFixed(1)+'%</td><td class="'+tone(DAYPCT)+'">'+sign(DAYPCT,2)+'</td></tr></tfoot></table>';

  var hc = el('hCount'); if(hc) hc.textContent = rows.length+' of '+HOLDINGS.length+' shown';
  qsa('th', wrap).forEach(function(th){

}

var TARGETS = { Technology:26, Healthcare:12, 'Consumer Staples':8, Energy:6, Commodities:5, Funds:33, Cash:6 };
function drawDrift(){
  var wrap = el('driftWrap'); if(!wrap) return;
  var groups = {};
  for(var i=0;i<HOLDINGS.length;i++){
    var h = HOLDINGS[i];
    var key = h.cash ? 'Cash' : (h.sec === 'Diversified' ? 'Funds' : h.sec);
    groups[key] = (groups[key] || 0) + gbp(h);
  }
  var keys = [];
  for(var k in TARGETS){ if(TARGETS.hasOwnProperty(k) && groups[k]) keys.push(k); }
  var maxDrift = 1;
  for(var j=0;j<keys.length;j++){
    var a = Math.abs((groups[keys[j]]||0)/TOTAL*100 - TARGETS[keys[j]]);
    if(a > maxDrift) maxDrift = a;
  }
  var html = '';
  for(var m=0;m<keys.length;m++){
    var kk = keys[m];
    var act = (groups[kk]||0)/TOTAL*100, tgt = TARGETS[kk], diff = act - tgt;
    var w = Math.abs(diff)/maxDrift*46;
    var col = diff > 0 ? '#9d8cff' : '#5fd0d8';
    html += '<div class="drow"><div class="dname">'+kk+'</div>'+
      '<div class="dtrack"><div class="base"></div>'+
      '<div class="b" style="'+(diff>=0 ? 'left:50%;width:'+w+'%' : 'right:50%;width:'+w+'%')+';background:'+col+';opacity:.85"></div></div>'+
      '<div class="dval"><b style="'+(diff>0?'color:#b9adff':'')+'">'+(diff>=0?'+':'')+diff.toFixed(1)+' pts</b><br>'+act.toFixed(1)+'% vs '+tgt+'%</div></div>';
  }
  wrap.innerHTML = html;
}

function drawTwoTides(){

  if(W < 50) return;
  var padL=48, padR=20, padT=18, padB=28, n=366;
  var p = SERIES.slice(-n), b = BSERIES.slice(-n);
  var rp = [], rb = [];
  for(var i=0;i<n;i++){ rp.push((p[i]/p[0]-1)*100); rb.push((b[i]/b[0]-1)*100); }
  var all = rp.concat(rb);
  var mn = all[0], mx = all[0];
  for(var a=1;a<all.length;a++){ if(all[a]<mn) mn=all[a]; if(all[a]>mx) mx=all[a]; }
  var pd = (mx-mn)*0.12 || 1; mn -= pd; mx += pd;
  function X(i){ return padL + (i/(n-1))*(W-padL-padR); }
  function Y(v){ return padT + (1-(v-mn)/(mx-mn))*(H-padT-padB); }

  var grid = '', axis = '';

function lookThroughSectors(){
  var out = {};
  for(var i=0;i<SECTORS.length;i++) out[SECTORS[i]] = 0;
  for(var j=0;j<HOLDINGS.length;j++){
    var h = HOLDINGS[j];
    if(h.fund){
      var mix = FUND_MIX[h.fund], w = gbp(h);
      for(var k in mix){ if(mix.hasOwnProperty(k)) out[k] = (out[k]||0) + w*mix[k]; }
    } else {
      out[h.sec] = (out[h.sec]||0) + gbp(h);
    }
  }
  for(var s in out){ if(out.hasOwnProperty(s)) out[s] = out[s]/TOTAL*100; }
  return out;
}
function lookThroughRegions(){
  var out = {};
  for(var j=0;j<HOLDINGS.length;j++){
    var h = HOLDINGS[j];
    if(h.fund){
      var mix = FUND_REGION[h.fund], w = gbp(h);
      for(var k in mix){ if(mix.hasOwnProperty(k)) out[k] = (out[k]||0) + w*mix[k]; }
    } else {
      var r = h.reg === 'Global' ? 'Rest of world' : h.reg;
      out[r] = (out[r]||0) + gbp(h);
    }
  }
  for(var s in out){ if(out.hasOwnProperty(s)) out[s] = out[s]/TOTAL*100; }
  return out;
}

function getDims(){

  var sorted = HOLDINGS.slice().sort(function(a,b){ return gbp(b) - gbp(a); });
  var top5 = 0; for(var i=0;i<5;i++) top5 += gbp(sorted[i]); top5 = top5/TOTAL*100;
  var nonGbp = 0;
  for(var j=0;j<HOLDINGS.length;j++) if(HOLDINGS[j].ccy !== 'GBP') nonGbp += gbp(HOLDINGS[j]);
  nonGbp = nonGbp/TOTAL*100;
  var cashPct = findHolding('CASH').sh/TOTAL*100;

function drawDD(){
  var wrap = el('ddWrap'); if(!wrap) return;
  var tip = el('ddTip');
  qsa('svg',wrap).forEach(function(n){ n.parentNode.removeChild(n); });
  var W = wrap.clientWidth || 620, H = wrap.clientHeight || 200;
  if(W < 50) return;
  var padL=34, padR=12, padT=14, padB=20;
  var s = SERIES.slice(-366), n = s.length;
  var peak = s[0], dd = new Array(n);
  for(var i=0;i<n;i++){ if(s[i] > peak) peak = s[i]; dd[i] = (s[i]/peak - 1)*100; }
  var mn = dd[0];
  for(var j=1;j<n;j++) if(dd[j] < mn) mn = dd[j];
  mn -= 2;
  function X(i){ return padL + (i/(n-1))*(W-padL-padR); }
  function Y(v){ return padT + (v/mn)*(H-padT-padB); }
  var line = ''; for(var k=0;k<n;k++) line += (k?'L':'M')+X(k).toFixed(1)+','+Y(dd[k]).toFixed(1);
  var area = line + 'L'+X(n-1).toFixed(1)+','+padT+' L'+padL+','+padT+' Z';

  var g = '';
  var marks = [-4,-8,-12];
  for(var mi=0;mi<marks.length;mi++){
    var v = marks[mi];
    if(v < mn){
      g += '<line x1="'+padL+'" y1="'+Y(v)+'" x2="'+(W-padR)+'" y2="'+Y(v)+'" stroke="rgba(178,220,232,.08)"/>';
      g += '<text x="'+(padL-8)+'" y="'+(Y(v)+3.4)+'" fill="#7796a3" font-size="9.5" text-anchor="end" font-family="Nunito Sans" font-weight="700">'+v+'%</text>';
    }
  }
  var mi2 = 0; for(var q=0;q<n;q++) if(dd[q] < dd[mi2]) mi2 = q;
  g += '<line x1="'+padL+'" y1="'+padT+'" x2="'+(W-padR)+'" y2="'+padT+'" stroke="rgba(178,220,232,.25)"/>';
  g += '<circle cx="'+X(mi2).toFixed(1)+'" cy="'+Y(dd[mi2]).toFixed(1)+'" r="3.4" fill="#ff7a68"/>';
  g += '<text x="'+(X(mi2)+8).toFixed(1)+'" y="'+(Y(dd[mi2])-7).toFixed(1)+'" fill="#ff7a68" font-size="9.5" font-weight="800" font-family="Nunito Sans">'+dd[mi2].toFixed(1)+'% \u00B7 Feb 26</text>';

  wrap.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+
    '<defs><linearGradient id="ddg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#ff7a68" stop-opacity=".04"/><stop offset="100%" stop-color="#ff7a68" stop-opacity=".3"/></linearGradient></defs>'+
    g+'<path d="'+area+'" fill="url(#ddg)"/>'+
    '<path d="'+line+'" fill="none" stroke="#ff7a68" stroke-width="1.4" stroke-linejoin="round"/></svg>');

  wrap.addEventListener('pointermove', function(e){
    var r = wrap.getBoundingClientRect();
    var x = clamp(e.clientX - r.left, padL, W-padR);
    var i2 = clamp(Math.round((x-padL)/(W-padL-padR)*(n-1)), 0, n-1);
    var d = new Date(TODAY); d.setDate(d.getDate()-(365-i2));
    tip.innerHTML = '<div class="tt">'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div>'+
      '<div class="tr"><span>Below peak</span><b class="loss">'+dd[i2].toFixed(2)+'%</b></div>'+
      '<div class="tr"><span>Value</span><b>'+money(dv(s[i2]),0)+'</b></div>';
    tip.classList.add('on');
    var tw = tip.offsetWidth || 150;
    tip.style.left = clamp(X(i2)-tw/2, 0, W-tw)+'px';
    tip.style.top  = Math.max(0, Y(dd[i2]) - tip.offsetHeight - 10)+'px';
  });
  wrap.addEventListener('pointerleave', function(){ tip.classList.remove('on'); });
}

      '<div style="font-size:11.5px;line-height:1.65;color:var(--mist)">'+
      '<p style="margin:0 0 11px">At <b style="color:#e9f4f6">'+WEIGHT(h).toFixed(2)+'%</b> of the portfolio this is '+
      (WEIGHT(h)>8?'one of your core positions':WEIGHT(h)>4?'a meaningful position':'a small position')+'. '+
      'With a beta of <b style="color:#e9f4f6">'+h.b.toFixed(2)+'</b> against your benchmark, a 1% move in the market typically moves this holding by about <b style="color:#e9f4f6">'+h.b.toFixed(2)+'%</b>.</p>'+
      '<p style="margin:0 0 11px">It accounts for roughly <b style="color:#b9adff">'+riskPct.toFixed(1)+'%</b> of the portfolio\u2019s total risk, against '+WEIGHT(h).toFixed(1)+'% of its value.</p>'+
      '<p style="margin:0">'+(h.r12<-10 ? 'This has been a losing position over 12 months. Ask what would have to change for it to earn its place.' : h.r12>25 ? 'This has been one of the strongest contributors. The question is whether the position has grown larger than you intended.' : 'A steady contributor. Nothing here demands action.')+'</p>'+
      '</div></section>'+
    '<section class="card span7"><div class="ch"><div><h2>Since you bought</h2><span class="ch-note">'+h.t+' \u00B7 holding period</span></div></div>'+
      '<div class="facts" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="fact"><span class="k">Held for</span><span class="v">3.2<small>years</small></span></div>'+
      '<div class="fact"><span class="k">Return p.a.</span><span class="v '+tone(gp)+'">'+sign(gp/3.2,1)+'</span></div>'+
      '<div class="fact"><span class="k">Best day</span><span class="v gain">+'+(Math.abs(h.day)+4.1).toFixed(1)+'%</span></div>'+
      '<div class="fact"><span class="k">Worst day</span><span class="v loss">\u2212'+(Math.abs(h.day)+5.6).toFixed(1)+'%</span></div>'+
      '</div>'+
      (peers.length ? '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">'+
      '<div class="microlabel" style="margin-bottom:9px">Elsewhere in '+h.sec+'</div>'+
      '<div style="display:flex;flex-direction:column">'+
      peers.map(function(p){
        return '<div class="peer-row" data-nav="holding" data-nav-arg="'+p.t+'">'+
          '<span class="peer-name">'+p.t+'<span>'+p.n+'</span></span>'+
          '<span class="peer-val '+tone(p.r12)+'">'+sign(p.r12,1)+'</span></div>';
      }).join('')+'</div></div>' : '')+
    '</section>'+
  '</div>';
}

function drawHolding(t){
  var h = findHolding(t); if(!h) return;
  var wrap = el('hdWrap'); if(!wrap) return;
  var tip = el('hdTip');
  qsa('svg',wrap).forEach(function(n){ n.parentNode.removeChild(n); });
  var W = wrap.clientWidth || 620, H = wrap.clientHeight || 250;
  if(W < 50) return;
  var padL=48, padR=14, padT=16, padB=24;
  var s = priceSeries(h), n = s.length;
  var all = s.concat([h.cb]);
  var mn = all[0], mx = all[0];
  for(var i=1;i<all.length;i++){ if(all[i]<mn) mn=all[i]; if(all[i]>mx) mx=all[i]; }
  var pd = (mx-mn)*0.12 || 1; mn -= pd; mx += pd;
  function X(i){ return padL + (i/(n-1))*(W-padL-padR); }
  function Y(v){ return padT + (1-(v-mn)/(mx-mn))*(H-padT-padB); }
  var costY = Y(h.cb);
  var line = ''; for(var j=0;j<n;j++) line += (j?'L':'M')+X(j).toFixed(1)+','+Y(s[j]).toFixed(1);
  var between = line + 'L'+X(n-1).toFixed(1)+','+costY.toFixed(1)+' L'+padL+','+costY.toFixed(1)+' Z';

  var grid = '';
  for(var g=0;g<=3;g++){
    var v = mn + (mx-mn)*(g/3);
    grid += '<line x1="'+padL+'" y1="'+Y(v)+'" x2="'+(W-padR)+'" y2="'+Y(v)+'" stroke="rgba(178,220,232,.07)"/>';
    grid += '<text x="'+(padL-8)+'" y="'+(Y(v)+3.4)+'" fill="#7796a3" font-size="9.5" text-anchor="end" font-family="Nunito Sans" font-weight="700">'+SYM[h.ccy]+fmtN(v,0)+'</text>';
  }
  var ticks = '';
  for(var k=0;k<n;k+=21){
    var dd = new Date(TODAY); dd.setDate(dd.getDate()-(251-k));
    ticks += '<text x="'+X(k).toFixed(1)+'" y="'+(H-8)+'" fill="#7796a3" font-size="9" text-anchor="middle" font-family="Nunito Sans" font-weight="700">'+dd.toLocaleDateString('en-GB',{month:'short'}).toUpperCase()+'</text>';
  }

  wrap.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+
    '<defs>'+
    '<clipPath id="aboveC"><rect x="0" y="0" width="'+W+'" height="'+costY+'"/></clipPath>'+
    '<clipPath id="belowC"><rect x="0" y="'+costY+'" width="'+W+'" height="'+(H-costY)+'"/></clipPath>'+
    '</defs>'+
    grid+
    '<path d="'+between+'" fill="rgba(63,211,155,.19)" clip-path="url(#aboveC)"/>'+
    '<path d="'+between+'" fill="rgba(255,122,104,.19)" clip-path="url(#belowC)"/>'+
    '<line x1="'+padL+'" y1="'+costY.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+costY.toFixed(1)+'" stroke="rgba(178,220,232,.6)" stroke-width="1.2" stroke-dasharray="5 4"/>'+
    '<path d="'+line+'" fill="none" stroke="#b9adff" stroke-width="1.7" stroke-linejoin="round" style="filter:drop-shadow(0 0 7px rgba(157,140,255,.7))"/>'+
    '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(s[n-1]).toFixed(1)+'" r="3.4" fill="#fff"/>'+
    ticks+'</svg>');

  wrap.addEventListener('pointermove', function(e){
    var r = wrap.getBoundingClientRect();
    var x = clamp(e.clientX - r.left, padL, W-padR);
    var i2 = clamp(Math.round((x-padL)/(W-padL-padR)*(n-1)), 0, n-1);
    var d = new Date(TODAY); d.setDate(d.getDate()-(251-i2));
    tip.innerHTML = '<div class="tt">'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+'</div>'+
      '<div class="tr"><span>Price</span><b>'+SYM[h.ccy]+fmtN(s[i2],2)+'</b></div>'+
      '<div class="tr"><span>vs cost</span><b class="'+tone(s[i2]-h.cb)+'">'+sign((s[i2]/h.cb-1)*100,1)+'</b></div>';
    tip.classList.add('on');
    var tw = tip.offsetWidth || 150;
    tip.style.left = clamp(X(i2)-tw/2, 0, W-tw)+'px';
    tip.style.top  = Math.max(0, Y(s[i2]) - tip.offsetHeight - 12)+'px';
  });
  wrap.addEventListener('pointerleave', function(){ tip.classList.remove('on'); });
}

/* ============================================================
   BINDING HELPERS
   ============================================================ */
function bindTideRanges(){
  var wrap = el('tideRanges'); if(!wrap) return;
  var btns = qsa('button', wrap);
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click', function(){
        state.range = b.getAttribute('data-r');
        for(var j=0;j<btns.length;j++) btns[j].classList.toggle('on', btns[j] === b);
        try{ drawTide(); }catch(e){ console.error(e); }
      });
    })(btns[i]);
  }
}
function bindHFilters(){
  var wrap = el('hFilter'); if(!wrap) return;
  var btns = qsa('button', wrap);
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click', function(){
        state.filter = b.getAttribute('data-f');
        for(var j=0;j<btns.length;j++) btns[j].classList.toggle('on', btns[j] === b);
        try{ drawTable(); }catch(e){ console.error(e); }
      });
    })(btns[i]);
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function safe(name, fn){
  try{ fn(); } catch(e){ console.error('['+name+']', e); }
}

function render(reset){
  var page = state.page;
  var arg  = state.arg;
  var view = el('view'); if(!view) return;

  var html = '';
  if(page === 'holdings')          html = pageHoldings();
  else if(page === 'performance')  html = pagePerformance();
  else if(page === 'analysis')     html = pageAnalysis();
  else if(page === 'holding')      html = pageHolding(arg);
  else                             html = pageOverview();
  view.innerHTML = html;

  var navPage = (page === 'holding') ? 'holdings' : page;
  var links = qsa('#nav a');
  for(var i=0;i<links.length;i++){
    var a = links[i];
    var target = a.getAttribute('data-nav');
    if(target === navPage) a.classList.add('on');
    else a.classList.remove('on');
  }

  safe('rail', updateRail);

  if(page === 'overview'){
    safe('tide', drawTide);
    safe('reef', drawReef);
    safe('ledger', drawLedger);
    safe('exposure', drawExposure);
    safe('signals', drawSignals);
    safe('tideRanges', bindTideRanges);
  } else if(page === 'holdings'){
    safe('field', drawField);
    safe('table', drawTable);
    safe('drift', drawDrift);
    safe('hFilter', bindHFilters);
  } else if(page === 'performance'){
    safe('twoTides', drawTwoTides);
    safe('months', drawMonths);
    safe('trailing', drawTrailing);
    safe('attrib', drawAttrib);
    safe('income', drawIncome);
  } else if(page === 'analysis'){
    safe('sounding', drawSounding);
    safe('sector', drawSector);
    safe('look', drawLook);
    safe('region', drawRegion);
    safe('dd', drawDD);
    safe('condition', drawCondition);
  } else if(page === 'holding'){
    safe('holding', function(){ drawHolding(arg); });
  }

  if(reset !== false){
    var m = el('main');
    if(m) m.scrollTop = 0;
  }
}

/* ============================================================
   INIT
   ============================================================ */
function bindCurrency(){
  var btns = qsa('#curSwitch button');
  for(var i=0;i<btns.length;i++){
    (function(b){
      b.addEventListener('click', function(){
        state.ccy = b.getAttribute('data-ccy');
        for(var j=0;j<btns.length;j++) btns[j].classList.toggle('on', btns[j] === b);
        render(false);
      });
    })(btns[i]);
  }
}

function init(){
  /* read initial route from the URL, if there is one */
  var r = readHash();
  if(r.page && r.page !== 'overview'){ state.page = r.page; state.arg = r.arg; }
  else if(location.hash){
    state.page = r.page; state.arg = r.arg;
  } else {
    try{ location.hash = '#/overview'; }catch(e){}
  }

  window.addEventListener('hashchange', onHashChange);
  document.addEventListener('click', handleClick, false);
  bindCurrency();

  var rT;
  window.addEventListener('resize', function(){
    clearTimeout(rT);
    rT = setTimeout(function(){ render(false); }, 180);
  });

  render(true);
}

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
</body>
</html>
