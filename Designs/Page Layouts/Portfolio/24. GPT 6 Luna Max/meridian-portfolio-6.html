<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b100e" />
  <meta name="description" content="Meridian, a private portfolio workspace. An interactive standalone design prototype." />
  <title>Meridian | Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b100e;
      --surface: #101714;
      --surface-2: #141c18;
      --surface-3: #1a241e;
      --rule: #26312a;
      --rule-soft: #1d2721;
      --text: #ecf1e9;
      --muted: #87948a;
      --quiet: #5d6a61;
      --acid: #d8ff63;
      --acid-dim: #a8c944;
      --up: #b4e985;
      --down: #ef9480;
      --blue: #82b7b0;
      --serif: "Iowan Old Style", "Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html { min-width: 360px; background: var(--bg); }
    body {
      min-width: 360px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 82% 3%, rgba(99, 133, 72, .085), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--acid);
      outline-offset: 3px;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }
    ::selection { background: rgba(216, 255, 99, .23); color: #fff; }

    .app-shell { display: flex; width: 100%; height: 100vh; min-height: 620px; overflow: hidden; }
    .sidebar {
      position: relative;
      z-index: 4;
      display: flex;
      flex: 0 0 224px;
      flex-direction: column;
      width: 224px;
      padding: 25px 15px 15px;
      border-right: 1px solid var(--rule-soft);
      background: rgba(11, 16, 14, .88);
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 10px; }
    .brand-mark { display: block; flex: 0 0 28px; width: 28px; height: 28px; color: var(--acid); }
    .brand-word { color: #f3f6ee; font-size: 17px; font-weight: 570; letter-spacing: -.065em; line-height: 1; }
    .brand-caption { margin-top: 5px; color: var(--quiet); font-size: 8px; font-weight: 700; letter-spacing: .17em; }
    .account-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 33px 4px 25px;
      padding: 11px 10px;
      border-top: 1px solid var(--rule-soft);
      border-bottom: 1px solid var(--rule-soft);
      color: #a6b1a7;
      font-size: 11px;
      letter-spacing: .02em;
    }
    .account-switch .account-type { display: flex; align-items: center; gap: 9px; }
    .account-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acid); box-shadow: 0 0 11px rgba(216,255,99,.45); }
    .nav-group { margin: 0 0 25px; }
    .nav-label { padding: 0 12px 9px; color: var(--quiet); font-size: 9px; font-weight: 700; letter-spacing: .16em; }
    .nav-item {
      position: relative;
      display: flex;
      width: 100%;
      height: 38px;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #8b978d;
      text-align: left;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .2s ease;
    }
    .nav-item:hover { background: rgba(255,255,255,.035); color: var(--text); }
    .nav-item:active { transform: translateY(1px); }
    .nav-item[aria-current="page"] { background: #172019; color: #eff4e9; }
    .nav-item[aria-current="page"]::before { position: absolute; left: -15px; top: 8px; width: 2px; height: 22px; background: var(--acid); content: ""; }
    .nav-item[aria-current="page"] .nav-icon { color: var(--acid); }
    .nav-icon { display: block; width: 16px; height: 16px; flex: 0 0 16px; color: #78847a; }
    .nav-label-text { flex: 1; font-size: 12px; }
    .nav-key { color: #526056; font-family: var(--mono); font-size: 9px; }
    .nav-unread { width: 5px; height: 5px; border-radius: 50%; background: var(--acid); }
    .sidebar-spacer { flex: 1; min-height: 20px; }
    .sidebar-note { padding: 13px 11px 17px; border-top: 1px solid var(--rule-soft); color: var(--quiet); font-size: 10px; line-height: 1.65; }
    .sidebar-note strong { color: #a1ada1; font-weight: 500; }
    .profile { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid var(--rule-soft); }
    .avatar { display: grid; width: 28px; height: 28px; flex: 0 0 28px; place-items: center; border: 1px solid #475348; border-radius: 50%; background: #202a21; color: #d8e5c9; font-family: var(--serif); font-size: 12px; }
    .profile-name { color: #bec8bd; font-size: 11px; }
    .profile-caption { margin-top: 3px; color: var(--quiet); font-size: 9px; }

    .main-panel { display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .topbar {
      position: relative;
      z-index: 3;
      display: flex;
      height: 62px;
      flex: 0 0 62px;
      align-items: center;
      justify-content: space-between;
      padding: 0 43px;
      border-bottom: 1px solid var(--rule-soft);
      background: rgba(11, 16, 14, .82);
      backdrop-filter: blur(14px);
    }
    .breadcrumb { display: flex; align-items: center; gap: 10px; color: var(--quiet); font-size: 10px; letter-spacing: .11em; }
    .breadcrumb .crumb-current { color: #bec9bd; letter-spacing: .04em; }
    .crumb-slash { color: #48534a; font-family: var(--serif); font-size: 16px; }
    .top-actions { display: flex; align-items: center; gap: 19px; }
    .sample-status { display: inline-flex; align-items: center; gap: 7px; color: #78857a; font-size: 9px; letter-spacing: .12em; white-space: nowrap; }
    .sample-status::before { width: 5px; height: 5px; border-radius: 50%; background: #8ead61; content: ""; box-shadow: 0 0 8px rgba(174,226,100,.35); }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid #354237;
      border-radius: 3px;
      background: #131a15;
      color: #dbe5d6;
      font-size: 10px;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease;
    }
    .download-btn:hover { border-color: #91a76a; background: #1a241b; }
    .download-btn svg { width: 13px; height: 13px; color: var(--acid); }
    .screen-view { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; scrollbar-color: #344137 transparent; scrollbar-width: thin; }
    .page { max-width: 1480px; margin: 0 auto; padding: 35px 48px 76px; animation: page-in .38s cubic-bezier(.2,.75,.25,1) both; }
    @keyframes page-in { from { opacity: .45; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { transform: scale(.82); opacity: .55; } 50% { transform: scale(1.13); opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -150; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes drift { 0%,100% { transform: translateY(0); opacity: .8; } 50% { transform: translateY(-3px); opacity: 1; } }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; margin-bottom: 27px; }
    .eyebrow { margin: 0 0 10px; color: #9eae96; font-size: 9px; font-weight: 700; letter-spacing: .19em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin: 0; color: #edf2e9; font-family: var(--serif); font-size: clamp(32px, 3.4vw, 47px); font-weight: 400; letter-spacing: -.055em; line-height: 1.04; }
    h1 em { color: var(--acid); font-weight: 400; }
    .page-intro { max-width: 470px; margin: 9px 0 0; color: #8c998e; font-size: 12px; line-height: 1.55; }
    .balance-block { min-width: 240px; padding-bottom: 3px; text-align: right; }
    .micro-label { color: #77847a; font-size: 9px; font-weight: 650; letter-spacing: .15em; text-transform: uppercase; }
    .balance-value { margin-top: 7px; color: #f1f3e9; font-family: var(--mono); font-size: clamp(28px, 3vw, 39px); font-weight: 400; letter-spacing: -.07em; line-height: 1; }
    .balance-value .cents { color: #b6c2b2; font-size: .57em; letter-spacing: -.04em; }
    .balance-change { display: flex; align-items: center; justify-content: flex-end; gap: 7px; margin-top: 9px; color: var(--up); font-family: var(--mono); font-size: 11px; }
    .balance-change .period { color: #7f8b80; font-family: var(--sans); font-size: 10px; }
    .positive { color: var(--up) !important; }
    .negative { color: var(--down) !important; }
    .neutral { color: #a6b1a4 !important; }

    .chart-section { position: relative; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: linear-gradient(120deg, rgba(22,31,24,.66), rgba(13,19,16,.13) 65%); }
    .chart-toolbar { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 18px; padding: 0 14px 0 2px; }
    .chart-id { display: flex; align-items: center; gap: 10px; color: #b9c4b9; font-size: 10px; }
    .chart-id-mark { display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid #43513d; border-radius: 50%; color: var(--acid); font-family: var(--serif); font-size: 12px; }
    .chart-id small { color: #657166; font-family: var(--mono); font-size: 9px; }
    .range-switch { display: flex; align-items: center; gap: 2px; }
    .range-btn {
      min-width: 35px;
      padding: 6px 8px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: #718074;
      font-family: var(--mono);
      font-size: 9px;
      cursor: pointer;
      transition: color .18s ease, background .18s ease, border-color .18s ease;
    }
    .range-btn:hover { color: var(--text); }
    .range-btn[aria-pressed="true"] { border-color: #303d31; background: #1a2519; color: var(--acid); }
    .chart-canvas { position: relative; height: 248px; padding: 0 0 0; }
    .chart-canvas svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart-gridline { stroke: #26312a; stroke-width: 1; stroke-dasharray: 2 7; }
    .chart-axis-label { fill: #5f6c62; font-family: var(--mono); font-size: 10px; }
    .chart-line { fill: none; stroke: var(--acid); stroke-linecap: round; stroke-linejoin: round; stroke-width: 2; }
    .chart-line-glow { fill: none; stroke: rgba(216,255,99,.18); stroke-linecap: round; stroke-linejoin: round; stroke-width: 8; filter: blur(5px); }
    .chart-benchmark { fill: none; stroke: #617369; stroke-dasharray: 3 6; stroke-linecap: round; stroke-width: 1.3; }
    .chart-guide { stroke: rgba(216,255,99,.45); stroke-width: 1; stroke-dasharray: 3 5; }
    .chart-dot { fill: var(--acid); stroke: #111711; stroke-width: 4; }
    .chart-hit { fill: transparent; cursor: crosshair; }
    .chart-tooltip { position: absolute; z-index: 2; display: none; min-width: 124px; padding: 9px 11px; border: 1px solid #43513e; background: rgba(15,22,17,.96); box-shadow: 0 8px 28px rgba(0,0,0,.3); pointer-events: none; }
    .chart-tooltip.visible { display: block; }
    .chart-tooltip .tip-date { color: #829084; font-size: 9px; letter-spacing: .1em; }
    .chart-tooltip .tip-value { margin-top: 4px; color: var(--text); font-family: var(--mono); font-size: 14px; }
    .chart-tooltip .tip-change { margin-top: 3px; color: var(--up); font-family: var(--mono); font-size: 10px; }
    .chart-foot { display: flex; min-height: 37px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 3px; color: #77847a; font-size: 9px; }
    .chart-legend { display: flex; align-items: center; gap: 17px; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-mark { width: 13px; height: 2px; background: var(--acid); }
    .legend-mark.benchmark { height: 0; border-top: 1px dashed #75887a; background: transparent; }
    .chart-period-total { color: #a8b3a7; font-family: var(--mono); font-size: 10px; }
    .chart-period-total strong { color: var(--up); font-weight: 500; }

    .overview-grid { display: grid; grid-template-columns: 1fr 1.17fr 1.05fr; margin-top: 27px; border-bottom: 1px solid var(--rule); }
    .overview-grid .section-panel { min-width: 0; padding: 0 23px 22px; border-right: 1px solid var(--rule-soft); }
    .overview-grid .section-panel:first-child { padding-left: 0; }
    .overview-grid .section-panel:last-child { padding-right: 0; border-right: 0; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-height: 23px; margin-bottom: 18px; }
    .section-heading h2 { margin: 0; color: #e0e8de; font-size: 12px; font-weight: 550; letter-spacing: -.015em; }
    .section-heading .section-meta { color: #667368; font-family: var(--mono); font-size: 9px; }
    .text-action { display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #a4b798; font-size: 10px; cursor: pointer; }
    .text-action:hover { color: var(--acid); }
    .text-action svg { width: 12px; height: 12px; }

    .health-content { display: flex; align-items: center; gap: 16px; }
    .health-ring { display: block; width: 83px; height: 83px; flex: 0 0 83px; overflow: visible; }
    .health-score { fill: #f0f3e8; font-family: var(--mono); font-size: 23px; letter-spacing: -.09em; }
    .health-score-label { fill: #778579; font-family: var(--sans); font-size: 7px; letter-spacing: 1px; }
    .health-copy .health-state { color: var(--acid); font-family: var(--serif); font-size: 19px; font-style: italic; }
    .health-copy p { max-width: 160px; margin: 5px 0 0; color: #7f8b80; font-size: 10px; line-height: 1.5; }
    .health-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 16px; padding-top: 11px; border-top: 1px solid var(--rule-soft); color: #79867b; font-size: 9px; }
    .health-foot strong { color: #bac7b9; font-family: var(--mono); font-weight: 400; }
    .health-foot button { padding: 0; border: 0; background: none; color: #bac7b9; cursor: pointer; }
    .health-foot button:hover { color: var(--acid); }

    .allocation-content { display: flex; align-items: center; gap: 15px; }
    .allocation-donut { display: block; width: 106px; height: 106px; flex: 0 0 106px; overflow: visible; transform: rotate(-90deg); }
    .allocation-center { transform: rotate(90deg); transform-origin: 50% 50%; }
    .allocation-center text { text-anchor: middle; }
    .allocation-center .center-value { fill: #e8efe3; font-family: var(--mono); font-size: 15px; }
    .allocation-center .center-caption { fill: #748075; font-family: var(--sans); font-size: 7px; letter-spacing: .9px; }
    .allocation-legend { display: grid; flex: 1; gap: 8px; min-width: 135px; }
    .allocation-legend-row { display: flex; align-items: center; gap: 7px; color: #9ba79b; font-size: 9px; }
    .allocation-swatch { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; }
    .allocation-legend-row span:nth-child(2) { flex: 1; white-space: nowrap; }
    .allocation-legend-row strong { color: #c3cec1; font-family: var(--mono); font-size: 9px; font-weight: 400; }

    .movers-group { margin-bottom: 13px; }
    .movers-label { display: flex; justify-content: space-between; margin: 0 0 7px; color: #6e7b70; font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
    .mover-row { display: grid; grid-template-columns: 41px minmax(60px,1fr) auto; align-items: center; gap: 9px; margin: 7px 0; }
    .mover-ticker { padding: 0; border: 0; background: none; color: #c3ccc0; font-family: var(--mono); font-size: 10px; text-align: left; cursor: pointer; }
    .mover-ticker:hover { color: var(--acid); }
    .mover-track { height: 3px; background: #222c25; }
    .mover-track span { display: block; height: 100%; background: var(--up); }
    .mover-track.negative span { margin-left: auto; background: #d17967; }
    .mover-change { color: #b2c0ad; font-family: var(--mono); font-size: 9px; }
    .mover-row.down .mover-change { color: var(--down); }
    .overview-bottom-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 38px; margin-top: 27px; }
    .bottom-panel { min-width: 0; padding-top: 1px; }
    .brief-holdings { border-top: 1px solid var(--rule); }
    .brief-holding { display: grid; grid-template-columns: minmax(115px, .82fr) minmax(85px, 1.1fr) 48px 67px; align-items: center; gap: 13px; min-height: 36px; border-bottom: 1px solid var(--rule-soft); }
    .brief-name { display: flex; min-width: 0; align-items: center; gap: 9px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
    .brief-name:hover .brief-ticker { color: var(--acid); }
    .brief-monogram { display: grid; width: 20px; height: 20px; flex: 0 0 20px; place-items: center; border: 1px solid #334035; border-radius: 50%; color: #bdc9ba; font-family: var(--mono); font-size: 7px; }
    .brief-company { overflow: hidden; color: #b3beb3; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .brief-ticker { color: #dce5d8; font-family: var(--mono); font-size: 9px; }
    .weight-track { height: 2px; background: #243027; }
    .weight-track span { display: block; height: 100%; background: linear-gradient(90deg, #8aa849, var(--acid)); }
    .brief-weight, .brief-value { color: #a9b4a8; font-family: var(--mono); font-size: 9px; text-align: right; }
    .brief-value { color: #7c887e; }
    .calendar-mini { border-top: 1px solid var(--rule); }
    .calendar-mini-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 11px; min-height: 47px; border-bottom: 1px solid var(--rule-soft); }
    .calendar-mini-date { color: #a4b394; font-family: var(--mono); font-size: 9px; line-height: 1.45; }
    .calendar-mini-date strong { display: block; color: #d1ddc9; font-size: 12px; font-weight: 400; }
    .calendar-mini-event { min-width: 0; color: #bdc7bc; font-size: 10px; }
    .calendar-mini-event small { display: block; overflow: hidden; margin-top: 3px; color: #718075; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .event-weight { color: #a6b29d; font-family: var(--mono); font-size: 9px; }

    .holdings-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 5px 0 19px; border-bottom: 1px solid var(--rule); }
    .tab-list { display: flex; align-items: center; gap: 23px; }
    .tab-btn { position: relative; padding: 11px 0 12px; border: 0; background: none; color: #718074; font-size: 10px; cursor: pointer; }
    .tab-btn[aria-selected="true"] { color: #e1e9db; }
    .tab-btn[aria-selected="true"]::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--acid); content: ""; }
    .holdings-total { color: #758278; font-family: var(--mono); font-size: 9px; }
    .ribbon-section { margin-bottom: 25px; }
    .ribbon-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .ribbon-heading .micro-label { font-size: 8px; }
    .ribbon-range { color: #68766b; font-family: var(--mono); font-size: 9px; }
    .weight-ribbon { display: flex; width: 100%; height: 13px; gap: 2px; overflow: hidden; }
    .ribbon-segment { min-width: 2px; height: 100%; padding: 0; border: 0; border-radius: 1px; opacity: .75; cursor: pointer; transition: opacity .18s ease, transform .18s ease; }
    .ribbon-segment:hover, .ribbon-segment.selected { z-index: 1; opacity: 1; transform: scaleY(1.34); }
    .ribbon-keys { display: flex; gap: 14px; margin-top: 9px; overflow: auto; scrollbar-width: none; }
    .ribbon-key { display: flex; flex: 0 0 auto; align-items: center; gap: 5px; padding: 0; border: 0; background: none; color: #859187; font-family: var(--mono); font-size: 8px; cursor: pointer; }
    .ribbon-key:hover { color: var(--acid); }
    .ribbon-key i { width: 5px; height: 5px; border-radius: 50%; }
    .subview-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 0 11px; }
    .subview-heading h2 { margin: 0; color: #e0e8df; font-family: var(--serif); font-size: 22px; font-weight: 400; letter-spacing: -.04em; }
    .subview-heading p { margin: 5px 0 0; color: #758177; font-size: 10px; }
    .map-scale { display: flex; align-items: center; gap: 8px; padding-bottom: 3px; color: #718075; font-size: 9px; }
    .scale-swatch { width: 65px; height: 5px; background: linear-gradient(90deg, #904a44, #293326, #9bbe67); }
    .treemap { position: relative; width: 100%; height: clamp(310px, 39vw, 488px); min-height: 300px; overflow: hidden; border: 1px solid #2a352d; background: #111713; }
    .treemap::after { position: absolute; z-index: 1; inset: 0; border: 1px solid rgba(255,255,255,.025); content: ""; pointer-events: none; }
    .treemap-tile {
      position: absolute;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(8px, 1.25vw, 17px);
      border: 3px solid #111713;
      background: var(--tile);
      color: #edf1e9;
      text-align: left;
      cursor: pointer;
      transition: filter .25s ease, outline .2s ease, z-index .2s ease;
    }
    .treemap-tile:hover { z-index: 3; filter: brightness(1.27); }
    .treemap-tile.selected { z-index: 2; outline: 1px solid var(--acid); outline-offset: -5px; }
    .tile-top { display: flex; width: 100%; align-items: flex-start; justify-content: space-between; gap: 5px; }

      function getTopMapHoldings() { return [...holdings].sort((a, b) => b.weight - a.weight).slice(0, 12); }

      function worstAspect(row, side) {
        if (!row.length) return Infinity;
        const areas = row.map(item => item.area);
        const sum = areas.reduce((a, b) => a + b, 0);
        const max = Math.max(...areas);
        const min = Math.min(...areas);
        const sideSquared = side * side;
        return Math.max(sideSquared * max / (sum * sum), (sum * sum) / (sideSquared * min));
      }

      function squarify(data, width, height) {
        const total = data.reduce((sum, item) => sum + item.weight, 0);
        const pending = data.map(item => ({ ...item, area: item.weight / total * width * height }));
        const placed = [];
        let x = 0, y = 0, w = width, h = height, row = [];

        function placeRow(items) {
          const area = items.reduce((sum, item) => sum + item.area, 0);
          if (w >= h) {
            const stripWidth = area / h;
            let localY = y;
            items.forEach(item => {
              const itemHeight = item.area / stripWidth;
              placed.push({ ...item, x, y: localY, w: stripWidth, h: itemHeight });
              localY += itemHeight;
            });
            x += stripWidth;
            w -= stripWidth;
          } else {
            const stripHeight = area / w;
            let localX = x;
            items.forEach(item => {
              const itemWidth = item.area / stripHeight;
              placed.push({ ...item, x: localX, y, w: itemWidth, h: stripHeight });
              localX += itemWidth;
            });
            y += stripHeight;
            h -= stripHeight;
          }
        }

        while (pending.length) {
          const item = pending[0];
          const side = Math.min(w, h);
          if (!row.length || worstAspect([...row, item], side) <= worstAspect(row, side)) {
            row.push(pending.shift());
          } else {
            placeRow(row);
            row = [];
          }
        }
        if (row.length) placeRow(row);
        return placed;
      }

t you think of the company.</p><button class="text-action" type="button" data-screen="signals">See the news through your holdings ${iconArrow}</button></section></div></div>`;

      function chartSeries(range) {
        const count = 96;
        const portfolioReturn = parseFloat(returnsByRange[range]) / 100;
        const benchmarkReturn = { '1D': .008, '1W': .019, '1M': .053, '3M': .073, '1Y': .1725, 'ALL': .4303 }[range] || .053;
        const volatility = { '1D': .004, '1W': .01, '1M': .026, '3M': .04, '1Y': .075, 'ALL': .12 }[range] || .026;
        const startValue = portfolioValue / (1 + portfolioReturn);
        return Array.from({ length: count }, (_, index) => {
          const t = index / (count - 1);
          const envelope = Math.sin(Math.PI * t);
          const wave = (Math.sin(index * .22) * .38 + Math.sin(index * .071 + 1.4) * .47 + Math.sin(index * .49 + .4) * .15) * volatility * envelope;
          const drawdown = index > count * .49 && index < count * .63 ? -volatility * .52 * Math.sin((index - count * .49) / (count * .14) * Math.PI) : 0;
          const value = startValue * (1 + t * portfolioReturn + wave + drawdown);
          const benchmark = startValue * (1 + t * benchmarkReturn + Math.sin(index * .19 + .5) * volatility * .3 * envelope);
          return { t, value, benchmark, returnToDate: (value / startValue - 1) * 100 };
        });
      }

      function chartDate(range, progress) {
        if (range === '1D') {
          const minutes = 570 + Math.round(progress * 390);
          const hours = Math.floor(minutes / 60);
          const minute = String(minutes % 60).padStart(2, '0');
          const hour12 = hours % 12 || 12;
          return `APR 16 · ${hour12}:${minute} ${hours >= 12 ? 'PM' : 'AM'} ET`;
        }
        if (range === '1W') {
          const marketDays = [10, 11, 14, 15, 16];
          const day = marketDays[Math.round(progress * (marketDays.length - 1))];
          return `APR ${String(day).padStart(2, '0')}`;
        }
        const starts = {
          '1W': Date.UTC(2025, 3, 10),
          '1M': Date.UTC(2025, 2, 16),
          '3M': Date.UTC(2025, 0, 16),
          '1Y': Date.UTC(2024, 3, 16),
          'ALL': Date.UTC(2019, 3, 16)
        };
        const days = { '1W': 6, '1M': 31, '3M': 90, '1Y': 365, 'ALL': 2191 }[range] || 31;
        const date = new Date(starts[range] + progress * days * 86400000);
        const options = { month: 'short', day: '2-digit' };
        if (range === '1Y' || range === 'ALL') options.year = '2-digit';
        return new Intl.DateTimeFormat('en-US', options).format(date).toUpperCase();
      }

      function drawChart(screen) {
        const svg = document.getElementById(screen === 'performance' ? 'performance-chart' : 'overview-chart');
        if (!svg) return;
        const points = chartSeries(state.range);
        state.chartPoints = points;
        const left = 67, right = 989, top = 19, bottom = 238;
        const plotValues = points.flatMap(point => screen === 'performance' ? [point.value / (portfolioValue / (1 + parseFloat(returnsByRange[state.range]) / 100)) * 100, point.benchmark / (portfolioValue / (1 + parseFloat(returnsByRange[state.range]) / 100)) * 100] : [point.value, point.benchmark]);
        const plotMin = Math.min(...plotValues);
        const plotMax = Math.max(...plotValues);
        const padding = (plotMax - plotMin) * .13 || 1;
        const domainMin = plotMin - padding;
        const domainMax = plotMax + padding;
        const yFor = value => bottom - (value - domainMin) / (domainMax - domainMin) * (bottom - top);
        const valueForPlot = point => screen === 'performance' ? point.value / (portfolioValue / (1 + parseFloat(returnsByRange[state.range]) / 100)) * 100 : point.value;
        const benchmarkForPlot = point => screen === 'performance' ? point.benchmark / (portfolioValue / (1 + parseFloat(returnsByRange[state.range]) / 100)) * 100 : point.benchmark;
        const coords = points.map(point => ({ x: left + point.t * (right - left), y: yFor(valueForPlot(point)), value: point.value, returnToDate: point.returnToDate }));
        const benchCoords = points.map(point => ({ x: left + point.t * (right - left), y: yFor(benchmarkForPlot(point)) }));
        const pathFrom = list => list.map((point, index) => `${index === 0 ? 'M' : 'L'}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(' ');
        const linePath = pathFrom(coords);
        const benchPath = pathFrom(benchCoords);
        const areaPath = `${linePath} L${right},${bottom} L${left},${bottom} Z`;
        const axisValues = [domainMax, domainMax - (domainMax - domainMin) / 3, domainMax - 2 * (domainMax - domainMin) / 3, domainMin];
        const formatAxis = value => screen === 'performance' ? `$${value.toFixed(0)}` : `$${Math.round(value / 1000)}k`;
        const grid = [top, top + 73, top + 146, bottom].map((y, index) => `<line class="chart-gridline" x1="${left}" y1="${y}" x2="${right}" y2="${y}"/><text class="chart-axis-label" x="4" y="${y + 3}">${formatAxis(axisValues[index])}</text>`).join('');
        const labelSets = {
          '1D': ['09:30', '11:00', '12:30', '14:00', '16:00'],
          '1W': ['10 APR', '11 APR', '14 APR', '15 APR', '16 APR'],
          '1M': ['16 MAR', '23 MAR', '30 MAR', '06 APR', '16 APR'],
          '3M': ['16 JAN', '08 FEB', '01 MAR', '24 MAR', '16 APR'],
          '1Y': ['APR 24', 'JUL 24', 'OCT 24', 'JAN 25', 'APR 25'],
          'ALL': ['2019', '2021', '2022', '2024', '2025']
        };
        const xLabels = labelSets[state.range].map((label, index) => `<text class="chart-axis-label" x="${left + index * (right-left)/4}" y="272" text-anchor="${index === 0 ? 'start' : index === 4 ? 'end' : 'middle'}">${label}</text>`).join('');
        svg.innerHTML = `<defs><linearGradient id="portfolio-fill-${screen}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8ff63" stop-opacity=".19"/><stop offset=".75" stop-color="#a8c944" stop-opacity=".025"/><stop offset="1" stop-color="#a8c944" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${areaPath}" fill="url(#portfolio-fill-${screen})"/><path class="chart-benchmark" d="${benchPath}"/><path class="chart-line-glow" d="${linePath}"/><path class="chart-line" d="${linePath}"/><line class="chart-guide" x1="${right}" y1="${top}" x2="${right}" y2="${bottom}" visibility="hidden"/><circle class="chart-dot" cx="${right}" cy="${coords[coords.length-1].y}" r="4"/><rect class="chart-hit" x="${left}" y="${top}" width="${right-left}" height="${bottom-top}"/><g>${xLabels}</g>`;
        const hit = svg.querySelector('.chart-hit');
        const guide = svg.querySelector('.chart-guide');
        const dot = svg.querySelector('.chart-dot');
        const tooltip = svg.parentElement.querySelector('.chart-tooltip');
        hit.addEventListener('pointermove', event => {
          const bounds = svg.getBoundingClientRect();
          const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
          const index = Math.round(ratio * (coords.length - 1));
          const point = coords[index];
          const xPercent = point.x / 1000;
          const yPercent = point.y / 280;
          guide.setAttribute('x1', point.x); guide.setAttribute('x2', point.x); guide.setAttribute('y1', top); guide.setAttribute('y2', bottom); guide.setAttribute('visibility', 'visible');
          dot.setAttribute('cx', point.x); dot.setAttribute('cy', point.y);
          const pointValue = screen === 'performance' ? valueForPlot(points[index]) : point.value;
          tooltip.querySelector('.tip-date').textContent = chartDate(state.range, index / (coords.length - 1));
          tooltip.querySelector('.tip-value').textContent = screen === 'performance' ? `$${pointValue.toFixed(2)} per $100` : money(pointValue, 0);
          tooltip.querySelector('.tip-change').textContent = `${point.returnToDate >= 0 ? '+' : ''}${point.returnToDate.toFixed(2)}% over ${state.range}`;
          tooltip.style.left = `${Math.max(4, Math.min(80, xPercent * 100 - 5))}%`;
          tooltip.style.top = `${Math.max(3, Math.min(65, yPercent * 100 - 6))}%`;
          tooltip.classList.add('visible');
        });
        hit.addEventListener('pointerleave', () => {
          guide.setAttribute('visibility', 'hidden');
          dot.setAttribute('cx', right); dot.setAttribute('cy', coords[coords.length - 1].y);
          tooltip.classList.remove('visible');
        });
      }

      function applySearch() {
        const input = document.getElementById('holding-search');
        if (!input) return;
        const query = input.value.trim().toLowerCase();
        state.search = input.value;
        let visible = 0;
        document.querySelectorAll('[data-row-ticker]').forEach(row => {
          const matches = !query || row.dataset.search.includes(query);
          row.hidden = !matches;
          if (matches) visible++;
        });
        const empty = document.getElementById('table-empty');
        if (empty) empty.hidden = visible !== 0;
      }

      function notify(message) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-text').textContent = message;
        toast.classList.add('visible');
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => toast.classList.remove('visible'), 2400);
      }

      function downloadHTML() {
        const source = '<!doctype html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([source], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'meridian-portfolio.html';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify('Standalone HTML saved to your downloads.');
      }

      function exportCSV() {
        const rows = [['Ticker','Name','Sector','Weight (%)','Market value (USD)','Daily move (%)','Price (USD)','Shares'], ...holdings.map(position => [position.ticker, position.name, position.sector, position.weight.toFixed(1), positionValue(position).toFixed(2), position.change.toFixed(2), position.price.toFixed(2), position.shares])];
        const csv = rows.map(row => row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('\r\n');
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        const link = document.createElement('a');
        link.href = url; link.download = 'meridian-sample-holdings.csv'; link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        notify('Holdings exported as CSV.');
      }

      function updateStressValue() {
        const output = document.querySelector('.stress-output');
        if (!output) return;
        const impact = scenarioImpact();
        const result = output.querySelector('.stress-result');
        result.textContent = `${impact.dollars > 0 ? '+' : '−'}${money(Math.abs(impact.dollars))}`;
        result.classList.toggle('positive', impact.dollars >= 0);
        output.querySelector('.stress-percent').textContent = `${impact.percent > 0 ? '+' : ''}${impact.percent.toFixed(2)}%`;
        output.querySelector('.stress-meter i').style.width = `${Math.min(100, Math.max(12, Math.abs(impact.percent) * 7))}%`;
      }

      document.addEventListener('click', event => {
        const target = event.target.closest('button');
        if (!target) return;

        if (target.dataset.screen) {
          state.screen = target.dataset.screen;
          renderScreen(false);
          return;
        }
        if (target.dataset.range) {
          state.range = target.dataset.range;
          renderScreen(true);
          return;
        }
        if (target.dataset.holdingsTab) {
          state.holdingsTab = target.dataset.holdingsTab;
          renderScreen(true);
          return;
        }
        if (target.dataset.ticker) {
          state.selectedTicker = target.dataset.ticker;
          renderScreen(true);
          return;
        }
        if (target.dataset.openHolding) {
          state.selectedTicker = target.dataset.openHolding;
          state.holdingsTab = 'map';
          state.screen = 'holdings';
          renderScreen(false);
          return;
        }
        if (target.dataset.sort) {
          if (state.sort === target.dataset.sort) state.sortDirection *= -1;
          else { state.sort = target.dataset.sort; state.sortDirection = -1; }
          renderScreen(true);
          return;
        }
        if (target.dataset.scenario) {
          state.scenario = target.dataset.scenario;
          renderScreen(true);
          return;
        }
        if (target.dataset.corrA && target.dataset.corrB) {
          state.correlation = [target.dataset.corrA, target.dataset.corrB];
          const detail = document.querySelector('.corr-detail');
          const value = correlationDescription(...state.correlation);
          const relation = value > .7 ? 'often move in tandem' : value > .4 ? 'have a moderate tendency to move together' : 'have moved more independently';
          detail.innerHTML = `<strong>${state.correlation[0]} × ${state.correlation[1]} · ${value.toFixed(2)}</strong><br />These two positions ${relation} in this illustrative sample.`;
          return;
        }
        if (target.dataset.region) {
          state.geoRegion = target.dataset.region;
          renderScreen(true);
          return;
        }
        if (target.dataset.storyFilter) {
          state.storyFilter = target.dataset.storyFilter;
          renderScreen(true);
          return;
        }
        if (target.dataset.calendarFilter) {
          state.calendarFilter = target.dataset.calendarFilter;
          renderScreen(true);
          return;
        }
        if (target.dataset.action === 'download') { downloadHTML(); return; }
        if (target.dataset.action === 'csv') { exportCSV(); return; }
      });

      document.addEventListener('input', event => {
        if (event.target.id === 'holding-search') applySearch();
        if (event.target.matches('[data-intensity]')) {
          state.intensity = Number(event.target.value);
          const label = event.target.parentElement.querySelector('strong');
          if (label) label.textContent = `${state.intensity}%`;
          updateStressValue();
        }
      });

      renderScreen(false);
    })();
  </script>
</body>
</html>
