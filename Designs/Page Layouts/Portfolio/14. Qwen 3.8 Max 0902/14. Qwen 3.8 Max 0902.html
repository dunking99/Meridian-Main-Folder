<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
/* ============================================================
   MERIDIAN — design tokens
   ============================================================ */
:root{
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --serif:'Instrument Serif',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r-panel:14px; --r-btn:9px; --r-pill:999px;
  --gap:14px;
  --ease:cubic-bezier(.22,.75,.25,1);
}
html[data-theme="dark"]{
  --bg:#080B10; --bg2:#0B0F15; --panel:#10151D; --panel2:#141B25; --panel3:#18202B;
  --line:#1E2733; --line2:#2B3746;
  --ink:#E9EDF2; --ink2:#9EA9B8; --ink3:#66717F;
  --pos:#33D69F; --posDim:rgba(51,214,159,.14);
  --neg:#FF6B6B; --negDim:rgba(255,107,107,.14);
  --gold:#E4B25C; --teal:#39BEC9; --blue:#7AA2F7; --coral:#FF9166; --moss:#9CCB6A; --rose:#F07FA8; --sand:#D9C7A3;
  --grid:rgba(255,255,255,.045);
  --shadow:0 18px 40px -22px rgba(0,0,0,.9);
  --glow:radial-gradient(60% 60% at 50% 0%,rgba(57,190,201,.10),transparent 70%);
}
html[data-theme="light"]{
  --bg:#EDEAE3; --bg2:#F4F2EC; --panel:#FBFAF7; --panel2:#F5F3ED; --panel3:#EFEDE6;
  --line:#DFDACE; --line2:#CBC4B4;
  --ink:#141A21; --ink2:#5A6472; --ink3:#8B93A0;
  --pos:#0E9F6E; --posDim:rgba(14,159,110,.12);
  --neg:#D64545; --negDim:rgba(214,69,69,.12);
  --gold:#B07D18; --teal:#12808C; --blue:#3A62C8; --coral:#C75B2C; --moss:#5E8F32; --rose:#B84A76; --sand:#8A7448;
  --grid:rgba(20,26,33,.06);
  --shadow:0 16px 34px -24px rgba(30,35,45,.55);
  --glow:radial-gradient(60% 60% at 50% 0%,rgba(18,128,140,.10),transparent 70%);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 82% -8%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 65%),
    radial-gradient(700px 460px at 8% 4%,color-mix(in srgb,var(--gold) 7%,transparent),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/100% 34px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/34px 100%;
  mask-image:radial-gradient(120% 100% at 50% 0%,#000 30%,transparent 100%);
  opacity:.9;
}
::selection{background:color-mix(in srgb,var(--teal) 40%,transparent);color:var(--ink)}
/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box}

/* ============================================================
   Shell
   ============================================================ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:236px 1fr;height:100vh}
.rail{
  border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 88%,transparent);
  backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px;border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand .wm{font-family:var(--serif);font-size:23px;letter-spacing:.01em;line-height:1}
.brand .tag{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.navwrap{padding:12px 10px;overflow-y:auto;flex:1}
.navhead{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink3);padding:12px 8px 7px;font-weight:600}
.navitem{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-btn);color:var(--ink2);
  cursor:pointer;font-weight:500;font-size:12.5px;position:relative;transition:.18s var(--ease);border:1px solid transparent;
}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.on{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.navitem.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--teal)}
.navitem .ic{width:16px;height:16px;flex:none;opacity:.9}
.navitem .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:99px;background:var(--panel3);color:var(--ink2);border:1px solid var(--line)}
.subnav{margin:3px 0 8px 26px;border-left:1px solid var(--line);padding-left:0}
.subnav a{
  display:block;padding:5px 10px;font-size:12px;color:var(--ink3);cursor:pointer;position:relative;transition:.15s;
}
.subnav a:hover{color:var(--ink)}
.subnav a.on{color:var(--ink);font-weight:600}
.subnav a.on::before{content:'';position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:var(--gold);border-radius:2px}
.railfoot{padding:12px;border-top:1px solid var(--line)}
.health{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}
.health .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.meter{height:5px;border-radius:99px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .8s var(--ease)}

.main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
/* topbar */
.topbar{
  display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg2) 82%,transparent);backdrop-filter:blur(10px);z-index:30;flex:none;
}
.crumb{display:flex;align-items:baseline;gap:8px;min-width:0}
.crumb .c1{font-family:var(--serif);font-size:22px;line-height:1}
.crumb .sep{color:var(--ink3)}
.crumb .c2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.picker{position:relative}
.pbtn{
  display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-btn);
  padding:6px 10px;cursor:pointer;color:var(--ink);font-size:12px;font-weight:500;transition:.16s;
}
.pbtn:hover{border-color:var(--line2);background:var(--panel2)}
.pbtn .dot{width:7px;height:7px;border-radius:99px;background:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.menu{
  position:absolute;top:calc(100% + 7px);left:0;min-width:246px;background:var(--panel);border:1px solid var(--line2);
  border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:80;display:none;
}
.menu.open{display:block;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.985)}}
.menu .mi{display:flex;gap:10px;align-items:center;padding:8px 9px;border-radius:8px;cursor:pointer;transition:.14s}
.menu .mi:hover{background:var(--panel2)}
.menu .mi.on{background:var(--panel2)}
.spacer{flex:1}
.tbtn{
  width:32px;height:32px;display:grid;place-items:center;border-radius:var(--r-btn);border:1px solid var(--line);
  background:var(--panel);color:var(--ink2);cursor:pointer;transition:.16s;position:relative;
}
.tbtn:hover{color:var(--ink);border-color:var(--line2);background:var(--panel2);transform:translateY(-1px)}
.tbtn .pip{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:99px;background:var(--coral);border:2px solid var(--panel)}
.searchbox{
  display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-btn);
  padding:0 10px;height:32px;min-width:210px;color:var(--ink3);cursor:pointer;transition:.16s;
}
.searchbox:hover{border-color:var(--line2);color:var(--ink2)}
.searchbox kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;border:1px solid var(--line2);border-radius:4px;padding:1px 4px;color:var(--ink3)}
.clock{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap;letter-spacing:-.01em}
.clock b{color:var(--pos);font-weight:500}

/* ticker */
.ticker{
  flex:none;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 60%,transparent);
  overflow:hidden;height:34px;position:relative;
}
.ticker::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--bg) 0,transparent 6%,transparent 94%,var(--bg) 100%)}
.tick-track{display:flex;gap:0;align-items:center;height:100%;width:max-content;animation:slide 62s linear infinite}
.ticker:hover .tick-track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.tk{display:flex;align-items:center;gap:7px;padding:0 16px;border-right:1px solid var(--line);height:100%;font-family:var(--mono);font-size:11px;cursor:pointer;transition:.15s}
.tk:hover{background:var(--panel2)}
.tk .s{font-weight:600;color:var(--ink);letter-spacing:.02em}
.tk .p{color:var(--ink2)}
.tk .d{font-weight:500}
.tk.up .d{color:var(--pos)} .tk.dn .d{color:var(--neg)}
.tk.flash-up{background:var(--posDim)} .tk.flash-dn{background:var(--negDim)}

/* subtabs */
.subbar{
  flex:none;display:flex;align-items:center;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);
  background:var(--bg);position:relative;z-index:20;
}
.tab{
  padding:13px 14px 12px;font-size:12.5px;font-weight:600;color:var(--ink3);cursor:pointer;position:relative;
  transition:color .18s;letter-spacing:.01em;display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink2)}
.tab.on{color:var(--ink)}
.tab .n{font-family:var(--mono);font-size:9.5px;color:var(--ink3);border:1px solid var(--line);padding:0 4px;border-radius:4px}
.tab.on .n{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.ind{position:absolute;bottom:-1px;height:2px;background:var(--gold);border-radius:2px;transition:.34s var(--ease);box-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent)}
.subbar .right{margin-left:auto;display:flex;align-items:center;gap:14px;padding:8px 0;font-size:11px;color:var(--ink3)}

/* stage */
.stage{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 60px;scroll-behavior:smooth}
.view{display:none}
.view.on{display:block}
.g12{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}
.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media(max-width:1400px){.c3{grid-column:span 6}.c4{grid-column:span 6}.c5{grid-column:span 6}.c7{grid-column:span 12}.c8{grid-column:span 12}.c9{grid-column:span 12}}
@media(max-width:900px){.app{grid-template-columns:1fr}.rail{display:none}[class*="c"]{grid-column:span 12}}

/* panels */
.panel{
  background:linear-gradient(180deg,var(--panel) 0%,color-mix(in srgb,var(--panel) 92%,var(--bg)) 100%);
  border:1px solid var(--line);border-radius:var(--r-panel);position:relative;overflow:hidden;
  transition:border-color .25s,transform .25s var(--ease),box-shadow .25s;
}
.panel:hover{border-color:var(--line2)}
.panel.pad{padding:14px 15px}
.phead{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.phead h3{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.01em}
.phead .sub{font-size:10.5px;color:var(--ink3);margin-top:1px}
.label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.serif{font-family:var(--serif)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--ink2)}.dim{color:var(--ink3)}
.big{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.035em;line-height:1.05}
.xl{font-family:var(--serif);font-size:38px;line-height:.98;letter-spacing:-.01em}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:var(--r-pill);font-size:10.5px;
  font-weight:600;border:1px solid var(--line);color:var(--ink2);background:var(--panel2);cursor:pointer;transition:.15s;white-space:nowrap;
}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--teal) 16%,transparent);border-color:color-mix(in srgb,var(--teal) 45%,transparent);color:var(--teal)}
.pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--ink2);background:var(--panel2)}
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:var(--r-btn);border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;transition:.16s var(--ease);
}
.btn:hover{background:var(--panel3);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#12161C}
html[data-theme="light"] .btn.pri{color:#FFFDF7}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{background:transparent;border-color:var(--line)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-btn);padding:2px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--ink3);font-family:var(--mono);font-size:10.5px;font-weight:500;
  padding:3.5px 9px;border-radius:6px;cursor:pointer;transition:.16s;letter-spacing:.02em;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
html[data-theme="light"] .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* stat band */
.band{display:grid;grid-template-columns:1.5fr repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden;background:var(--panel)}
.band .cell{padding:13px 16px;border-right:1px solid var(--line);position:relative;transition:.2s;cursor:default;overflow:hidden}
.band .cell:last-child{border-right:0}
.band .cell:hover{background:var(--panel2)}
.band .cell:hover .spark{opacity:1}
.band .cell::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--acc,var(--teal));opacity:0;transition:.25s}
.band .cell:hover::after{opacity:.85}
.spark{position:absolute;right:10px;bottom:8px;opacity:.55;transition:.25s}
.delta{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;font-weight:500}
@media(max-width:1100px){.band{grid-template-columns:1fr 1fr}.band .cell{border-bottom:1px solid var(--line)}}

/* tables */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{
  position:sticky;top:0;z-index:5;background:var(--panel2);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);font-weight:600;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;
  white-space:nowrap;user-select:none;transition:.15s;
}
.tbl th:hover{color:var(--ink)}
.tbl th.l,.tbl td.l{text-align:left}
.tbl th .ar{opacity:0;font-size:8px;margin-left:3px}
.tbl th.sorted{color:var(--gold)}
.tbl th.sorted .ar{opacity:1}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.row{cursor:pointer;transition:background .14s}
.tbl tr.row:hover{background:var(--panel2)}
.tbl tr.row.sel{background:color-mix(in srgb,var(--teal) 8%,transparent)}
.tbl tr.row.exp{background:var(--panel2)}
.tick{display:flex;align-items:center;gap:9px}
.sym{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ink);letter-spacing:-.01em}
.nm{font-family:var(--sans);font-size:10.5px;color:var(--ink3);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:600;flex:none;border:1px solid}
.wbar{width:74px;height:5px;border-radius:99px;background:var(--panel3);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.wbar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .7s var(--ease)}
.tagx{font-size:9.5px;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.detail-row>td{padding:0;border-bottom:1px solid var(--line);background:var(--bg2)}
.detail{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;animation:fadeUp .3s var(--ease)}
.detail>div{padding:14px 16px;border-right:1px solid var(--line)}
.detail>div:last-child{border-right:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(-4px)}}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3.5px 0;border-bottom:1px dashed var(--line);font-size:11.5px}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.thesis{font-size:12px;color:var(--ink2);line-height:1.55;font-family:var(--sans)}

/* charts */
.chart{position:relative;width:100%}
svg text{font-family:var(--mono);font-size:9.5px;fill:var(--ink3)}
svg .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
svg .ax{fill:var(--ink3);font-size:9px}
.crosshair{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .12s}
.chart.hot .crosshair{opacity:.85}
.tip{
  position:fixed;z-index:200;pointer-events:none;background:color-mix(in srgb,var(--panel3) 96%,transparent);
  border:1px solid var(--line2);border-radius:10px;padding:8px 10px;box-shadow:var(--shadow);font-size:11px;
  opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;min-width:132px;backdrop-filter:blur(6px);
}
.tip.on{opacity:1;transform:none}
.tip .tt{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.tip .tr{display:flex;justify-content:space-between;gap:14px;padding:1.5px 0}
.tip .tr b{font-family:var(--mono);font-weight:500}
.legend{display:flex;flex-direction:column;gap:1px}
.lgi{display:flex;align-items:center;gap:9px;padding:5px 7px;border-radius:7px;cursor:pointer;transition:.15s}
.lgi:hover{background:var(--panel2)}
.lgi .sw{width:8px;height:8px;border-radius:3px;flex:none}
.lgi .nm2{font-size:11.5px;color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgi .vv{font-family:var(--mono);font-size:11px;color:var(--ink)}
.lgi.off{opacity:.38}

/* reveal */
.reveal{opacity:0;transform:translateY(12px)}
.reveal.in{opacity:1;transform:none;transition:opacity .55s var(--ease),transform .55s var(--ease)}

/* treemap */
.tm{position:relative;width:100%;border-radius:10px;overflow:hidden;background:var(--panel2)}
.tmc{position:absolute;border:1px solid color-mix(in srgb,var(--bg) 70%,transparent);padding:6px 7px;overflow:hidden;cursor:pointer;transition:.18s var(--ease);display:flex;flex-direction:column;justify-content:space-between}
.tmc:hover{z-index:5;transform:scale(1.022);filter:brightness(1.14)}
.tmc .t{font-family:var(--mono);font-size:11px;font-weight:600;color:#08111A;letter-spacing:-.01em}
.tmc .v{font-family:var(--mono);font-size:9.5px;color:rgba(8,17,26,.72);font-weight:500}
.tmc small{font-family:var(--sans);font-size:9px;color:rgba(8,17,26,.6);text-transform:uppercase;letter-spacing:.08em}

/* misc */

/* ---- portfolio time series (5y daily) ---- */
function buildSeries(){
  const r=rng(20260612), N=1258, out=[]; let v=1_180_000, b=1_180_000;
  const d0=new Date(AS_OF); d0.setDate(d0.getDate()-N);
  for(let i=0;i<N;i++){
    const d=new Date(d0); d.setDate(d.getDate()+i);
    const drift=0.00048, shock=(i>600&&i<640)?-0.0038:0, drawdownK=(i>900&&i<935)?-0.0026:0;
    v*=1+drift+gauss(r)*0.0092+shock+drawdownK;
    b*=1+0.00037+gauss(r)*0.0086+shock*0.9+drawdownK*1.15;
    out.push({d,v,b});
  }
  // anchor last point to real total
  const k=TOT_MV()/out[N-1].v, kb=(TOT_MV()*0.86)/out[N-1].b;
  out.forEach(p=>{p.v*=k;p.b*=kb});
  return out;
}

/* ---- SQUARIFIED TREEMAP ---- */
function squarify(items,x,y,w,h){
  const total=items.reduce((a,i)=>a+i.value,0); let rest=items.slice(),rect={x,y,w,h},out=[];
  const scaled=rest.map(i=>({...i,area:i.value/total*w*h}));
  const worst=(row,len)=>{const s=row.reduce((a,r)=>a+r.area,0),mx=Math.max(...row.map(r=>r.area)),mn=Math.min(...row.map(r=>r.area));
    return Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn))};
  let row=[];
  const layoutRow=()=>{
    const s=row.reduce((a,r)=>a+r.area,0);
    const horiz=rect.w>=rect.h; const len=horiz?s/rect.h:s/rect.w;
    let off=0;
    row.forEach(r=>{
      const br=horiz?r.area/len:r.area/len;
      out.push({...r,x:horiz?rect.x:rect.x+off,y:horiz?rect.y+off:rect.y,w:horiz?len:br,h:horiz?br:len});
      off+=br;
    });
    if(horiz){rect.x+=len;rect.w-=len}else{rect.y+=len;rect.h-=len}
    row=[];
  };
  scaled.forEach(it=>{
    const horiz=rect.w>=rect.h; const len=horiz?rect.h:rect.w;
    const trial=row.concat([it]);
    if(row.length&&worst(trial,len)>worst(row,len)){layoutRow();row=[it]}else row=trial;
  });
  if(row.length)layoutRow();
  return out;
}

    let rings='';for(let k=1;k<=4;k++){const rr=R*k/4;
      rings+=`<polygon points="${axes.map((_,i)=>P(i,rr).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`}
    const spokes=axes.map((a,i)=>{const[x,y]=P(i,R);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`}).join('');
    const labs=axes.map((a,i)=>{const[x,y]=P(i,R+15);const an=Math.abs(x-cx)<4?'middle':x>cx?'start':'end';
      return `<text x="${x}" y="${y+3}" text-anchor="${an}" style="font-family:var(--sans);font-size:9.5px;fill:var(--ink2);font-weight:600">${a}</text>`}).join('');
    const polys=series.map(s=>{
      const pts=s.v.map((v,i)=>P(i,R*clamp(v/100,0,1)));
      return `<g class="rserie" data-s="${s.name}">
        <polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${s.color}" fill-opacity=".16" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>
        ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${s.color}"/>`).join('')}</g>`}).join('');
    node.innerHTML=`<svg width="${W}" height="${Hh}">${rings}${spokes}${polys}${labs}
      <rect width="${W}" height="${Hh}" fill="transparent" id="rov"/></svg>`;
    $('#rov',node).addEventListener('mousemove',e=>{
      const r=node.getBoundingClientRect(),dx=e.clientX-r.left-cx,dy=e.clientY-r.top-cy;
      let a=Math.atan2(dy,dx)+Math.PI/2; if(a<0)a+=Math.PI*2;
      const i=Math.round(a/(2*Math.PI)*n)%n;
      showTip(`<div class="tt">${axes[i]}</div>${series.map(s=>`<div class="tr"><span style="color:${s.color}">● ${s.name}</span><b>${s.v[i]}</b></div>`).join('')}
        <div class="tr" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span class="mut">Delta</span><b class="${sgn(series[0].v[i]-series[1].v[i])}">${(series[0].v[i]-series[1].v[i]).toFixed(1)}</b></div>`,e.clientX,e.clientY);
    });
    $('#rov',node).addEventListener('mouseleave',hideTip);
  },210);
}

/* ---- WATERFALL / ATTRIBUTION ---- */
function waterfall(node,items){
  mount(node,(W,Hh)=>{
    const pad={l:64,r:56,t:10,b:22}, w=W-pad.l-pad.r, h=Hh-pad.t-pad.b;
    const mx=Math.max(...items.map(i=>Math.abs(i.v)))*1.06, zero=pad.t+h/2;
    const bh=Math.min(15,(h-6)/items.length-3);
    let s=`<line x1="${pad.l}" x2="${pad.l+w}" y1="${zero}" y2="${zero}" stroke="var(--line2)"/>`;
    [-mx,-mx/2,0,mx/2,mx].forEach(v=>{const x=pad.l+scale(v,-mx,mx,0,w);
      s+=`<line class="gl" x1="${x}" x2="${x}" y1="${pad.t}" y2="${pad.t+h}"/><text class="ax" x="${x}" y="${Hh-6}" text-anchor="middle">${v.toFixed(1)}</text>`});
    items.forEach((it,i)=>{
      const y=pad.t+i*((h-4)/items.length)+2, x0=pad.l+scale(0,-mx,mx,0,w), x1=pad.l+scale(it.v,-mx,mx,0,w);
      const col=it.v>=0?'var(--pos)':'var(--neg)';
      s+=`<text class="ax" x="${pad.l-8}" y="${y+bh/2+3}" text-anchor="end" style="font-family:var(--mono);font-size:10px;fill:var(--ink2)">${it.t}</text>
      <rect class="wf-bar" data-i="${i}" x="${Math.min(x0,x1)}" y="${y}" width="${Math.abs(x1-x0)}" height="${bh}" rx="2.5" fill="${col}" opacity=".85"/>
      <text class="ax" x="${pad.l+w+8}" y="${y+bh/2+3}" style="fill:${col};font-size:10px">${it.v>=0?'+':''}${it.v.toFixed(1)}</text>`;
    });
    node.innerHTML=`<svg width="${W}" height="${Hh}">${s}<rect id="wfov" x="${pad.l}" y="${pad.t}" width="${w}" height="${h}" fill="transparent"/></svg>`;
    $$('.wf-bar',node).forEach(b=>{
      b.addEventListener('mousemove',e=>{const it=items[+b.dataset.i];const h0=H.find(x=>x.t===it.t);
        showTip(`<div class="tt">${it.t} — contribution</div>
        <div class="tr"><span class="mut">To return</span><b class="${sgn(it.v)}">${it.v>=0?'+':''}${it.v.toFixed(2)} pp</b></div>
        ${h0?`<div class="tr"><span class="mut">Weight</span><b>${(h0.mv/scopedMV()*100).toFixed(2)}%</b></div>
        <div class="tr"><span class="mut">Position P/L</span><b class="${sgn(h0.plp)}">${pct(h0.plp,1)}</b></div>`:''}`,e.clientX,e.clientY)});
      b.addEventListener('mouseleave',hideTip);
      b.addEventListener('mouseenter',()=>b.setAttribute('opacity','1'));
      b.addEventListener('mouseleave',()=>b.setAttribute('opacity','.85'));
    });
  },300);
}

/* ---- GENERIC MULTI-LINE ---- */
function lineChart(node,series,opts={}){
  mount(node,(W,Hh)=>{
    const pad={l:6,r:44,t:10,b:20},w=W-pad.l-pad.r,h=Hh-pad.t-pad.b;
    const all=series.flatMap(s=>s.v); let mn=Math.min(...all),mx=Math.max(...all);
    if(opts.zero)mn=Math.min(mn,0); const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
    const n=series[0].v.length, X=i=>pad.l+scale(i,0,n-1,0,w), Y=v=>pad.t+scale(v,mn,mx,h,0);
    let s=[0,.5,1].map(t=>{const v=mn+(mx-mn)*t,y=Y(v);
      return `<line class="gl" x1="${pad.l}" x2="${pad.l+w}" y1="${y}" y2="${y}"/><text class="ax" x="${pad.l+w+7}" y="${y+3}">${opts.fmtY?opts.fmtY(v):v.toFixed(0)}</text>`}).join('');
    if(mn<0&&mx>0)s+=`<line x1="${pad.l}" x2="${pad.l+w}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line2)"/>`;
    (opts.xlabels||[]).forEach(l=>{s+=`<text class="ax" x="${X(l.i)}" y="${Hh-5}" text-anchor="middle">${l.l}</text>`});
    series.forEach(se=>{
      const pts=se.v.map((v,i)=>[X(i),Y(v)]);
      if(se.area){const id='la'+Math.random().toString(36).slice(2,6);
        s+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".28"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${path(pts)} L${X(n-1)} ${pad.t+h} L${X(0)} ${pad.t+h} Z" fill="url(#${id})"/>`}
      s+=`<path class="mline" d="${path(pts)}" stroke="${se.color}" stroke-width="${se.w||1.7}" fill="none" stroke-linejoin="round" ${se.dash?`stroke-dasharray="${se.dash}"`:''}/>`;
    });
    s+=`<line class="crosshair" id="lch" x1="0" x2="0" y1="${pad.t}" y2="${pad.t+h}"/><rect id="lov" x="${pad.l}" y="${pad.t}" width="${w}" height="${h}" fill="transparent" style="cursor:crosshair"/>`;
    node.innerHTML=`<svg width="${W}" height="${Hh}" fill="none">${s}</svg>`;
    $$('.mline',node).forEach(p=>drawPath(p,700));
    const ov=$('#lov',node),ch=$('#lch',node);
    ov.addEventListener('mousemove',e=>{
      const r=node.getBoundingClientRect(),x=clamp(e.clientX-r.left-pad.l,0,w),i=Math.round(scale(x,0,w,0,n-1));
      ch.setAttribute('x1',X(i));ch.setAttribute('x2',X(i));node.classList.add('hot');
      showTip(`<div class="tt">${opts.labX?opts.labX(i):'Point '+i}</div>${series.map(se=>
        `<div class="tr"><span style="color:${se.color}">● ${se.name}</span><b class="${opts.colorBySign?sgn(se.v[i]):''}">${opts.fmtV?opts.fmtV(se.v[i]):se.v[i].toFixed(2)}</b></div>`).join('')}`,e.clientX,e.clientY);
    });
    ov.addEventListener('mouseleave',()=>{node.classList.remove('hot');hideTip()});
  },140);
}

/* ---- VERTICAL BARS (income) ---- */
function barChart(node,bars,opts={}){
  mount(node,(W,Hh)=>{
    const pad={l:6,r:44,t:12,b:24},w=W-pad.l-pad.r,h=Hh-pad.t-pad.b;
    const mx=Math.max(...bars.map(b=>b.v))*1.15, X=i=>pad.l+(i+.5)*(w/bars.length), bw=Math.min(26,w/bars.length*.58);
    const Y=v=>pad.t+scale(v,0,mx,h,0);
    let s=[0,.5,1].map(t=>{const v=mx*t,y=Y(v);return `<line class="gl" x1="${pad.l}" x2="${pad.l+w}" y1="${y}" y2="${y}"/><text class="ax" x="${pad.l+w+7}" y="${y+3}">${opts.fmtY?opts.fmtY(v):v.toFixed(0)}</text>`}).join('');
    bars.forEach((b,i)=>{
      const id='bg'+i;
      s+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${b.color}" stop-opacity=".95"/><stop offset="1" stop-color="${b.color}" stop-opacity=".42"/></linearGradient></defs>
      <rect class="brect" data-i="${i}" x="${X(i)-bw/2}" y="${Y(b.v)}" width="${bw}" height="${pad.t+h-Y(b.v)}" rx="3" fill="url(#${id})" style="cursor:pointer;transition:.2s"/>

      s+=`<path d="${path(pts)}" stroke="var(--gold)" stroke-width="1.5" fill="none" stroke-dasharray="3 2.5"/>
      ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="var(--gold)"/>`).join('')}`}
    s+=`<line class="crosshair" id="bch" x1="0" x2="0" y1="${pad.t}" y2="${pad.t+h}"/>`;
    node.innerHTML=`<svg width="${W}" height="${Hh}" fill="none">${s}</svg>`;
    $$('.brect',node).forEach(r=>{
      const b=bars[+r.dataset.i];
      r.addEventListener('mousemove',e=>{showTip(`<div class="tt">${b.full||b.l}</div>
        <div class="tr"><span class="mut">${opts.valName||'Amount'}</span><b>${opts.fmtV?opts.fmtV(b.v):usd(b.v,0)}</b></div>
        ${b.cum!=null?`<div class="tr"><span class="mut">Cumulative</span><b style="color:var(--gold)">${usd(b.cum,0)}</b></div>`:''}
        ${b.note?`<div class="tr"><span class="mut">Source</span><b>${b.note}</b></div>`:''}`,e.clientX,e.clientY);r.setAttribute('opacity','.8')});
      r.addEventListener('mouseleave',()=>{hideTip();r.setAttribute('opacity','1')});
    });
  },150);
}

function metrics(){
  const hs=scoped(), mv=hs.reduce((a,h)=>a+h.mv,0), cash=S.acct==='all'?CASH:S.acct==='vent'?0:CASH*.6;
  const cost=hs.reduce((a,h)=>a+h.cost,0);
  const d1=hs.reduce((a,h)=>a+h.d1pl,0);
  const inc=hs.reduce((a,h)=>a+h.mv*h.dy/100,0);
  const tot=mv+cash;
  const wavg=k=>hs.reduce((a,h)=>a+h[k]*h.mv,0)/mv;
  return {hs,mv,cash,cost,tot,pl:mv-cost,plp:(mv-cost)/cost*100,d1,d1p:d1/(mv-d1)*100,inc,yld:inc/mv*100,
    beta:wavg('beta'),pos:hs.filter(h=>h.pl>=0).length,neg:hs.filter(h=>h.pl<0).length,n:hs.length};
}

function priceHist(h,n=120){
  const seed=h.t.split('').reduce((a,c)=>a+c.charCodeAt(0),0)*977;
  const r=rng(seed),out=[];const end=h.px,start=end*(1-h.rev12/100*0.9);let v=start;
  for(let i=0;i<n;i++){const t=i/(n-1);v=lerp(v,start+(end-start)*t,.18)+v*gauss(r)*0.012;out.push(v)}
  out[n-1]=end;return out;
}

function perfStats(d){
  const rets=[];for(let i=1;i<d.length;i++)rets.push(d[i].v/d[i-1].v-1);
  const mu=rets.reduce((a,b)=>a+b,0)/rets.length;
  const sd=Math.sqrt(rets.reduce((a,b)=>a+(b-mu)**2,0)/rets.length)*Math.sqrt(252);
  const down=rets.filter(r=>r<0), dn=Math.sqrt(down.reduce((a,b)=>a+b*b,0)/down.length)*Math.sqrt(252);
  let peak=-1e18,dd=0;d.forEach(p=>{peak=Math.max(peak,p.v);dd=Math.min(dd,p.v/peak-1)});
  const r=(d.at(-1).v/d[0].v-1);
  const yrs={'1D':1/252,'1W':5/252,'1M':21/252,'3M':63/252,'YTD':105/252,'1Y':1,'3Y':3,'5Y':5}[S.range];
  return {ann:(Math.pow(1+r,1/yrs)-1)*100,vol:sd*100,sharpe:(sd*100-4.31)/(sd*100),sortino:(sd*100-4.31)/(dn*100||1),dd:dd*100,calmar:((Math.pow(1+r,1/yrs)-1)*100)/Math.abs(dd*100)};
}
function drawdownSeries(d){let peak=-1e18;return d.map(p=>{peak=Math.max(peak,p.v);return (p.v/peak-1)*100})}
function rolling(d,win){const out=[];for(let i=win;i<d.length;i+=Math.max(1,Math.round(win/24)))out.push((d[i].v/d[i-win].v-1)*100);return out}

  <div class="g12" style="margin-top:var(--gap)">

      <div class="phead"><div><h3>Policy compliance</h3><div class="sub">Investment policy statement checks</div></div><div style="flex:1"></div><span class="pill" style="color:var(--gold);border-color:color-mix(in srgb,var(--gold) 40%,transparent)">2 breaches</span></div>
      <div style="padding:8px 12px 12px" id="policy"></div>
    </div>
  </div>`;

  /* radar */
  radar($('#radarC'),['Growth','Income','Quality','Momentum','Low vol','Value','Liquidity'],
    [{name:'Meridian',v:[88,54,81,79,38,26,94],color:'var(--teal)'},{name:'S&P 500',v:[72,48,68,61,52,44,99],color:'var(--gold)'}]);

  /* risk budget */
  const g={};hs.forEach(h=>{g[h.ty]=g[h.ty]||{mv:0,pl:0,rb:0};g[h.ty].mv+=h.mv;g[h.ty].pl+=h.pl;g[h.ty].rb+=h.mv*Math.abs(h.beta||.6)});
  const totPl=Math.abs(Object.values(g).reduce((a,x)=>a+x.pl,0))||1, totRb=Object.values(g).reduce((a,x)=>a+x.rb,0)||1;
  $('#rb').innerHTML=Object.entries(g).sort((a,b)=>b[1].mv-a[1].mv).map(([k,d])=>{
    const rc=Math.abs(d.pl)/totPl*100, kc=d.rb/totRb*100;
    return `<div class="rbr" data-k="${k}" style="padding:7px 6px;border-radius:8px;cursor:pointer;transition:.15s">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">
        <span style="font-size:12px;font-weight:600">${k}</span>
        <span class="mono dim" style="font-size:10.5px">${usdS(d.mv)} · ${(d.mv/mv*100).toFixed(1)}%</span></div>
      <div style="display:flex;gap:4px;align-items:center"><span class="hint" style="width:14px">R</span>
        <div class="bar-track" style="height:6px"><i style="width:${rc}%;background:var(--teal)"></i></div><span class="mono" style="font-size:10px;width:34px;text-align:right">${rc.toFixed(0)}%</span></div>
      <div style="display:flex;gap:4px;align-items:center;margin-top:4px"><span class="hint" style="width:14px">K</span>
        <div class="bar-track" style="height:6px"><i style="width:${kc}%;background:var(--coral)"></i></div><span class="mono" style="font-size:10px;width:34px;text-align:right">${kc.toFixed(0)}%</span></div>
      <div style="margin-top:4px;font-size:10px;color:${kc>rc+6?'var(--neg)':rc>kc+6?'var(--pos)':'var(--ink3)'}">${kc>rc+6?'⚠ Taking more risk than return':rc>kc+6?'✓ Efficient — return exceeds risk share':'≈ Balanced'}</div>
    </div>`}).join('');
  $$('#rb .rbr').forEach(x=>{x.addEventListener('mouseenter',()=>x.style.background='var(--panel2)');
    x.addEventListener('mouseleave',()=>x.style.background='');
    x.addEventListener('click',()=>{S.filter=x.dataset.k;go('holdings');toast(`Holdings filtered to <b>${x.dataset.k}</b>`,'var(--teal)')})});

  /* VaR histogram */
  mount($('#varC'),(W,Hh)=>{
    const pad={l:6,r:6,t:8,b:18},w=W-pad.l-pad.r,h=Hh-pad.t-pad.b;
    const edges=Array.from({length:21},(_,i)=>-4+i*.4),counts=edges.slice(0,-1).map((e,i)=>rets.filter(r=>r>=e&&r<edges[i+1]).length);
    const mx=Math.max(...counts),bw=w/counts.length;
    let s=counts.map((c,i)=>{const x=pad.l+i*bw,bh=c/mx*h;
      const mid=(edges[i]+edges[i+1])/2;
      const col=mid<=var95?'var(--neg)':mid<0?'color-mix(in srgb,var(--neg) 45%,var(--panel3))':mid<1?'color-mix(in srgb,var(--pos) 40%,var(--panel3))':'var(--pos)';
      return `<rect class="vr" data-i="${i}" x="${x+1}" y="${pad.t+h-bh}" width="${bw-2}" height="${bh}" rx="1.5" fill="${col}" opacity=".85" style="cursor:pointer"/>`}).join('');
    const X=v=>pad.l+scale(v,-4,4.4,0,w);
    s+=`<line x1="${X(var95)}" x2="${X(var95)}" y1="${pad.t}" y2="${pad.t+h}" stroke="var(--gold)" stroke-width="1.4" stroke-dasharray="3 2"/>
      <text x="${X(var95)}" y="${pad.t+8}" text-anchor="middle" style="fill:var(--gold);font-size:8.5px">VaR95</text>
      <text class="ax" x="${pad.l}" y="${Hh-5}">−4%</text><text class="ax" x="${pad.l+w}" y="${Hh-5}" text-anchor="end">+4%</text>
      <text class="ax" x="${X(0)}" y="${Hh-5}" text-anchor="middle">0</text>`;
    const n=$('#varC');n.innerHTML=`<svg width="${W}" height="${Hh}" fill="none">${s}</svg>`;
    $$('.vr',n).forEach(r=>{const i=+r.dataset.i;
      r.addEventListener('mousemove',e=>showTip(`<div class="tt">Daily return bucket</div>
        <div class="tr"><span class="mut">Range</span><b>${edges[i].toFixed(1)}% to ${edges[i+1].toFixed(1)}%</b></div>
        <div class="tr"><span class="mut">Sessions</span><b>${counts[i]}</b></div>
        <div class="tr"><span class="mut">Frequency</span><b>${(counts[i]/rets.length*100).toFixed(1)}%</b></div>`,e.clientX,e.clientY));
      r.addEventListener('mouseleave',hideTip)});
  },150);

  /* factors */
  const FAC=[{n:'Growth',v:1.42,c:['NVDA','MSFT','AMZN']},{n:'Momentum',v:1.08,c:['VRT','NVDA','GLD']},
   {n:'Quality',v:.86,c:['MSFT','COST','SPGI']},{n:'Rate sensitivity',v:-.62,c:['TLT','VCIT','NVDA']},
   {n:'Value',v:-.94,c:['NVDA','LLY','COST']},{n:'Size',v:.38,c:['BRKB','JPM','VTI']},
   {n:'Low volatility',v:-.71,c:['BTC','VRT','ETH']},{n:'FX (non-USD)',v:.44,c:['ASML','SAP','NVO']}];
  $('#factors').innerHTML=FAC.map((f,i)=>{
    const wgt=Math.abs(f.v)/1.6*50;
    return `<div class="fr" data-i="${i}" style="display:flex;align-items:center;gap:9px;padding:6px;border-radius:8px;cursor:pointer;transition:.15s">
      <span style="width:98px;font-size:11.5px;color:var(--ink2);font-weight:500">${f.n}</span>
      <div style="flex:1;height:9px;position:relative;background:var(--panel3);border-radius:99px">
        <span style="position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)"></span>
        <i style="position:absolute;top:0;bottom:0;border-radius:99px;background:${f.v>=0?'var(--teal)':'var(--coral)'};transition:width .8s var(--ease);
          left:${f.v>=0?50:50-wgt}%;width:${wgt}%"></i></div>
      <span class="mono" style="width:46px;text-align:right;font-size:11.5px;color:${f.v>=0?'var(--teal)':'var(--coral)'}">${f.v>0?'+':''}${f.v.toFixed(2)}σ</span></div>`}).join('');
  $$('#factors .fr').forEach(r=>{
    const f=FAC[+r.dataset.i];
    r.addEventListener('mouseenter',()=>r.style.background='var(--panel2)');
    r.addEventListener('mouseleave',()=>r.style.background='');
    r.addEventListener('click',()=>{
      const list=f.c.map(t=>H.find(h=>h.t===t)).filter(Boolean);
      const dEl=$('#facDetail');dEl.style.display='block';
      dEl.innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="font-size:12px">${f.n}</b><span class="pill" style="color:${f.v>=0?'var(--teal)':'var(--coral)'}">${f.v>0?'+':''}${f.v.toFixed(2)}σ</span>
        <span class="hint" style="margin-left:auto">Top contributors</span></div>
        ${list.map(h=>`<div class="bar-row fc" data-id="${h.id}" style="padding:6px 4px">
          <div class="av" style="background:color-mix(in srgb,${h.typeC} 16%,transparent);border-color:color-mix(in srgb,${h.typeC} 38%,transparent);color:${h.typeC};width:24px;height:24px">${h.t.slice(0,2)}</div>
          <div style="flex:1"><div style="display:flex;justify-content:space-between"><span class="sym" style="font-size:11.5px">${h.t}</span>
            <span class="mono dim" style="font-size:10.5px">${(h.mv/mv*100).toFixed(2)}% wt · β ${h.beta.toFixed(2)}</span></div>
            <div class="bar-track" style="margin-top:4px;height:4px"><i style="width:${clamp(h.mv/mv*100*7,4,100)}%;background:${h.typeC}"></i></div></div>
          <span class="mono ${sgn(h.plp)}" style="font-size:11px;width:56px;text-align:right">${pct(h.plp,0)}</span></div>`).join('')}
        <div class="hint" style="margin-top:8px;line-height:1.5">${f.v>=0?'Overweight':'Underweight'} versus benchmark. Reducing this tilt by 0.5σ would cost an estimated ${(Math.abs(f.v)*0.42).toFixed(1)}pp of expected annual return.</div>`;
      $$('#facDetail .fc').forEach(x=>x.addEventListener('click',()=>{S.exp=x.dataset.id;go('holdings')}));
    });
  });

  /* correlation */
  const corrColor=c=>{const t=(c+1)/2;
    return t>=.5?`color-mix(in srgb,var(--teal) ${Math.round((t-.5)*2*84+10)}%,var(--panel2))`:`color-mix(in srgb,var(--coral) ${Math.round((.5-t)*2*84+10)}%,var(--panel2))`};
  $('#corr').innerHTML=`<div style="display:grid;grid-template-columns:56px repeat(8,1fr);gap:3px;align-items:center">
    <div></div>${CORR_A.map(a=>`<div class="label" style="text-align:center;font-size:9px;letter-spacing:.06em">${a}</div>`).join('')}
    ${CORR_A.map((a,i)=>`<div class="label" style="font-size:9px;letter-spacing:.06em;text-align:right;padding-right:4px">${a}</div>
      ${CORR_M[i].map((c,j)=>`<div class="cm" data-i="${i}" data-j="${j}" style="height:30px;border-radius:5px;display:grid;place-items:center;
        font-family:var(--mono);font-size:${i===j?9:10}px;cursor:${i===j?'default':'pointer'};background:${i===j?'var(--panel3)':corrColor(c)};
        color:${Math.abs(c)>.6?(document.documentElement.dataset.theme==='dark'?'#08111A':'#FFF'):'var(--ink2)'};transition:.15s;border:1px solid transparent">${i===j?'1.00':c.toFixed(2)}</div>`).join('')}`).join('')}
  </div>
  <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px" class="hint">
    <span>−1 hedge</span><div style="display:flex;gap:2px">${Array.from({length:11},(_,k)=>`<span style="width:15px;height:8px;border-radius:2px;background:${corrColor(-1+k*.2)}"></span>`).join('')}</div><span>+1 duplicate</span></div>`;
  $$('#corr .cm').forEach(c=>{
    const i=+c.dataset.i,j=+c.dataset.j;if(i===j)return;
    const rho=CORR_M[i][j];
    c.addEventListener('mouseenter',()=>c.style.transform='scale(1.1)');
    c.addEventListener('mouseleave',()=>c.style.transform='');
    c.addEventListener('click',()=>{
      const dEl=$('#corrDetail');dEl.style.display='block';
      const r=rng(i*31+j*7),pts=Array.from({length:60},()=>{const x=gauss(r);return[x,rho*x+Math.sqrt(1-rho*rho)*gauss(r)]});
      dEl.innerHTML=`<div style="display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:center">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
            <b style="font-size:12.5px">${CORR_A[i]} × ${CORR_A[j]}</b>
            <span class="pill" style="color:${rho>0?'var(--teal)':'var(--coral)'};font-weight:600">ρ = ${rho.toFixed(2)}</span>
            <span class="hint">${Math.abs(rho)>.7?'Near-duplicate exposure':Math.abs(rho)>.4?'Moderately linked':rho<0?'Genuine diversifier':'Effectively independent'}</span></div>
          <svg width="100%" height="92" viewBox="0 0 300 92" preserveAspectRatio="none">
            <line x1="150" y1="0" x2="150" y2="92" stroke="var(--line)"/><line x1="0" y1="46" x2="300" y2="46" stroke="var(--line)"/>
            <line x1="0" y1="${46-rho*46}" x2="300" y2="${46+rho*46}" stroke="${rho>0?'var(--teal)':'var(--coral)'}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".7"/>
            ${pts.map(p=>`<circle cx="${150+p[0]*46}" cy="${46-p[1]*40}" r="2.2" fill="${rho>0?'var(--teal)':'var(--coral)'}" fill-opacity=".55"/>`).join('')}
          </svg>
          <div style="display:flex;justify-content:space-between" class="hint"><span>${CORR_A[i]} daily return →</span><span>${CORR_A[j]} ↑</span></div>
        </div>

          <div class="label" style="margin-bottom:6px">Implication</div>
          <div class="hint" style="line-height:1.55">${rho>.6?`Owning both adds little diversification — combined they explain ${((rho*100)|0)}% of common variance.`:rho<0?`This pair is your ballast: ${CORR_A[j]} typically rises when ${CORR_A[i]} sells off.`:`Low shared variance; positions behave largely independently.`}</div>
          <button class="btn sm ghost" style="margin-top:9px;width:100%;justify-content:center" data-hedge="${CORR_A[j]}">Hedge with ${CORR_A[j]}</button>
        </div></div>`;
      dEl.querySelector('[data-hedge]').addEventListener('click',()=>toast(`Hedge ticket drafted — buy <b>${CORR_A[j]}</b> against ${CORR_A[i]} exposure.`,'var(--gold)'));
    });
  });

  /* stress engine */
  const drawStress=()=>{
    const imp=hs.map(h=>({h,p:shockImpact(h),d:h.mv*shockImpact(h)/100})).sort((a,b)=>a.d-b.d);
    const total=imp.reduce((a,x)=>a+x.d,0), tp=total/mv*100;
    const post=mv+total;
    const el2=$('#sImpact');el2.textContent=(total<0?'−':'+')+usd(Math.abs(total),0);
    el2.style.color=total<0?'var(--neg)':'var(--pos)';
    const p2=$('#sImpactP');p2.textContent=pct(tp,2);p2.className='mono '+sgn(tp);p2.style.fontSize='22px';
    $('#sPost').textContent=usd(post,0);
    const bar=$('#sBar');bar.style.width=clamp(Math.abs(tp)/40*50,0,50)+'%';
    bar.style.left=tp>=0?'50%':(50-clamp(Math.abs(tp)/40*50,0,50))+'%';
    bar.style.background=tp<0?'var(--neg)':'var(--pos)';
    const tags=[];
    if(tp<-8)tags.push(['SEVERE','var(--neg)']);else if(tp<-3)tags.push(['MODERATE','var(--gold)']);else if(Math.abs(tp)<=3)tags.push(['CONTAINED','var(--teal)']);else tags.push(['FAVOURABLE','var(--pos)']);
    if(imp[0].d<-mv*.03)tags.push([`${imp[0].h.t} is the largest drag`,'var(--coral)']);
    if(S.shocks.rates>150)tags.push(['Duration risk','var(--sand)']);
    if(S.shocks.recess)tags.push(['Cyclical exposure','var(--rose)']);
    $('#sTags').innerHTML=tags.map(([t,c])=>`<span class="chip" style="color:${c};border-color:color-mix(in srgb,${c} 40%,transparent)">${t}</span>`).join('');
    const worst=imp.slice(0,7),best=imp.slice(-4).reverse(),list=[...worst,...best];
    const mx=Math.max(...list.map(x=>Math.abs(x.p)))||1;
    // diverging bars — more legible than a line for categorical impact
    const n=$('#sChart');n.innerHTML='';
    n.style.height=(list.length*24+16)+'px';
    list.forEach((x,i)=>{
      const r=el(`<div style="display:flex;align-items:center;gap:9px;padding:3px 0;cursor:pointer" data-id="${x.h.id}">
        <span class="sym" style="width:56px;font-size:11.5px">${x.h.t}</span>
        <div style="flex:1;height:11px;position:relative;background:var(--panel3);border-radius:4px;overflow:hidden">

          <i style="position:absolute;top:0;bottom:0;border-radius:4px;background:${x.p<0?'var(--neg)':'var(--pos)'};opacity:.85;
            left:${x.p<0?50-Math.abs(x.p)/mx*50:50}%;width:${Math.abs(x.p)/mx*50}%;transition:width .5s var(--ease)"></i></div>
        <span class="mono" style="width:58px;text-align:right;font-size:11px;color:${x.p<0?'var(--neg)':'var(--pos)'}">${pct(x.p,1)}</span>
        <span class="mono dim" style="width:74px;text-align:right;font-size:10.5px">${usdS(x.d)}</span></div>`);
      r.addEventListener('mousemove',e=>showTip(`<div class="tt">${x.h.t} · ${x.h.sec}</div>
        <div class="tr"><span class="mut">Shock impact</span><b class="${sgn(x.p)}">${pct(x.p,2)}</b></div>
        <div class="tr"><span class="mut">Dollar impact</span><b class="${sgn(x.d)}">${usd(x.d,0)}</b></div>
        <div class="tr"><span class="mut">Weight</span><b>${(x.h.mv/mv*100).toFixed(2)}%</b></div>`,e.clientX,e.clientY));
      r.addEventListener('mouseleave',hideTip);
      r.addEventListener('click',()=>{S.exp=x.h.id;go('holdings')});
      n.append(r);
    });
  };
  ['rates','tech','usd','oil'].forEach(k=>{
    const sl=$('#sl-'+k);
    sl.addEventListener('input',()=>{S.shocks[k]=+sl.value;
      $('#sv-'+k).textContent=sl.value+(k==='rates'?' bp':'%');drawStress()});
  });
  $('#recSw').addEventListener('click',()=>{S.shocks.recess=!S.shocks.recess;$('#recSw').classList.toggle('on',S.shocks.recess);drawStress()});
  $('#resetS').addEventListener('click',()=>{S.shocks={rates:0,tech:0,usd:0,oil:0,recess:0};
    ['rates','tech','usd','oil'].forEach(k=>{$('#sl-'+k).value=0;$('#sv-'+k).textContent=k==='rates'?'0 bp':'0%'});
    $('#recSw').classList.remove('on');drawStress();toast('Scenario reset to base case.','var(--ink3)')});
  const PRE={base:{rates:0,tech:0,usd:0,oil:0,recess:0},'2022':{rates:425,tech:-33,usd:12,oil:8,recess:0},
    gfc:{rates:-120,tech:-41,usd:-6,oil:-45,recess:1},'airot':{rates:60,tech:-22,usd:4,oil:5,recess:0},
    soft:{rates:-75,tech:14,usd:-5,oil:-8,recess:0}};
  $$('[data-pre]').forEach(b=>b.addEventListener('click',()=>{
    $$('[data-pre]').forEach(x=>x.classList.toggle('on',x===b));
    S.shocks={...PRE[b.dataset.pre]};
    ['rates','tech','usd','oil'].forEach(k=>{$('#sl-'+k).value=S.shocks[k];$('#sv-'+k).textContent=S.shocks[k]+(k==='rates'?' bp':'%')});
    $('#recSw').classList.toggle('on',!!S.shocks.recess);drawStress();
    toast(`Loaded <b>${b.textContent}</b> scenario`,b.dataset.pre==='gfc'?'var(--neg)':'var(--teal)')}));
  drawStress();

  /* rebalancing */
  const TGT={Equity:50,ETF:12,Bond:7,Crypto:6,Commodity:4,Private:12,Cash:9};
  const drawRb=(applied)=>{
    const g={};hs.forEach(h=>g[h.ty]=(g[h.ty]||0)+h.mv);g.Cash=(g.Cash||0)+(S.acct==='all'?CASH:0);
    const rows=Object.entries(TGT).map(([k,t])=>{const a=(g[k]||0)/tot*100;return{k,t,a:applied?t:a,d:(applied?t:a)-t}});
    $('#rebal').innerHTML=rows.map(r=>{
      const drift=r.a-r.t, ad=Math.abs(drift), breach=ad>3;
      return `<div style="display:flex;align-items:center;gap:11px;padding:8px 6px;border-radius:9px;transition:.15s" class="rbr2">
        <span style="width:88px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px">
          <span style="width:8px;height:8px;border-radius:3px;background:var(${TYPE_C[r.k]||'--ink3'})"></span>${r.k}</span>
        <div style="flex:1;position:relative;height:22px">
          <div style="position:absolute;inset:0;background:var(--panel3);border-radius:6px;overflow:hidden">
            <i style="position:absolute;top:0;bottom:0;left:0;width:${r.a}%;background:color-mix(in srgb,var(${TYPE_C[r.k]||'--ink3'}) 42%,transparent);transition:width .9s var(--ease)"></i>
            <i style="position:absolute;top:0;bottom:0;left:0;width:${r.t}%;border-right:2px dashed var(--gold);transition:width .9s var(--ease)"></i></div>
        </div>
        <span class="mono" style="width:46px;text-align:right;font-size:11.5px">${r.a.toFixed(1)}%</span>
        <span class="mono dim" style="width:46px;text-align:right;font-size:11px">/ ${r.t}%</span>
        <span class="mono" style="width:60px;text-align:right;font-size:11.5px;color:${breach?'var(--neg)':Math.abs(drift)>1.5?'var(--gold)':'var(--pos)'}">${drift>0?'+':''}${drift.toFixed(1)}%</span>
        <span class="mono" style="width:76px;text-align:right;font-size:11px;color:${drift>0?'var(--neg)':'var(--pos)'}">${Math.abs(drift*tot/100)<500?'—':(drift>0?'SELL ':'BUY ')+usdS(Math.abs(drift*tot/100))}</span></div>`}).join('');
    $$('#rebal .rbr2').forEach(x=>{x.addEventListener('mouseenter',()=>x.style.background='var(--panel2)');
      x.addEventListener('mouseleave',()=>x.style.background='')});
    const turn=rows.reduce((a,r)=>a+Math.abs(r.d),0)/2;
    $('#turn').textContent=turn.toFixed(1)+'%';
    $('#taxc').textContent=usd(turn/100*tot*0.094,0);
    const driftTot=rows.reduce((a,r)=>a+Math.abs(r.a-r.t),0)/2;
    $('#driftPill').textContent='Drift '+driftTot.toFixed(1)+'%';
    $('#driftPill').style.color=driftTot>3?'var(--neg)':driftTot>1.5?'var(--gold)':'var(--pos)';
  };
  drawRb(false);
  $('#applyRb').addEventListener('click',e=>{
    drawRb(true);e.target.textContent='✓ Applied';e.target.style.background='var(--pos)';e.target.style.borderColor='var(--pos)';
    toast('Rebalance orders staged — <b>$41,220</b> across 7 sleeves. Review in the trade blotter.','var(--pos)');
    setTimeout(()=>{e.target.textContent='Apply suggestion';e.target.style.background='';e.target.style.borderColor=''},2600);
  });

  /* policy */
  const POL=[
   {s:'warn',t:'Single-name cap 8%',d:'NVDA at 9.4% — 1.4pp above limit',a:'Trim 62 shares'},
   {s:'warn',t:'Sector cap 25%',d:'Semiconductors at 27.1%',a:'Review ASML / TSM overlap'},
   {s:'ok',t:'Crypto sleeve ≤ 10%',d:'Digital assets at 8.9% of market value',a:''},
   {s:'ok',t:'Cash buffer ≥ 5%',d:'Cash at '+(CASH/tot*100).toFixed(1)+'%',a:''},
   {s:'ok',t:'Foreign exposure ≤ 30%',d:'Non-USD at 21.4%',a:''},
   {s:'ok',t:'Illiquids ≤ 15%',d:'Private holdings at 8.4%',a:''},
   {s:'ok',t:'Leverage 0%',d:'No margin outstanding; $0 borrowed',a:''},
   {s:'info',t:'TLG monitoring',d:'ESG screen flags 1 holding (BTC energy intensity)',a:'Open screen'},
  ];
  $('#policy').innerHTML=POL.map((p,i)=>{
    const c=p.s==='warn'?'var(--gold)':p.s==='info'?'var(--blue)':'var(--pos)';
    const ic=p.s==='warn'?'!':p.s==='info'?'i':'✓';
    return `<div class="pi" data-i="${i}" style="display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:9px;cursor:pointer;transition:.15s">
      <span style="width:18px;height:18px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:10px;font-weight:700;
        background:color-mix(in srgb,${c} 18%,transparent);color:${c};border:1px solid color-mix(in srgb,${c} 40%,transparent)">${ic}</span>
      <div style="flex:1;min-width:0"><div style="display:flex;gap:8px;align-items:baseline">
        <b style="font-size:12px;font-weight:600">${p.t}</b>
        <span class="mono" style="margin-left:auto;font-size:10.5px;color:${c}">${p.s==='warn'?'BREACH':p.s==='info'?'REVIEW':'PASS'}</span></div>
        <div class="hint" style="margin-top:2px">${p.d}</div>
        ${p.a?`<div class="pact" style="display:none;margin-top:7px"><button class="btn sm ghost">${p.a}</button></div>`:''}</div>
    </div>`}).join('');
  $$('#policy .pi').forEach(x=>{
    x.addEventListener('mouseenter',()=>x.style.background='var(--panel2)');
    x.addEventListener('mouseleave',()=>x.style.background='');
    x.addEventListener('click',()=>{const a=$('.pact',x);if(!a)return;
      const open=a.style.display!=='none';$$('#policy .pact').forEach(y=>y.style.display='none');if(!open)a.style.display='block'});
  });
  $$('#policy .pact .btn').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();toast(b.textContent+' — action queued.','var(--gold)')}));
  reveal(v);
}

   8 · BOOT
   ============================================================ */
function renderAll(){
  $('#tabCount').textContent=scoped().length;
  if(S.view==='overview')renderOverview();
  else if(S.view==='holdings')renderHoldings();
  else if(S.view==='performance')renderPerformance();
  else renderAnalysis();
}
renderNav();renderTicker();renderAcctMenu();renderBell();renderTabs();clock();
$('#acctPicker .dot').style.background='var(--teal)';
renderAll();
requestAnimationFrame(moveInd);setTimeout(moveInd,120);
setInterval(clock,1000);
setInterval(liveTick,2800);
addEventListener('resize',()=>{moveInd()});
setTimeout(()=>toast('Portfolio synced — <b>24 positions</b> priced at 16:00 ET. Press <b>⌘K</b> to jump anywhere.','var(--teal)'),900);
</script>
