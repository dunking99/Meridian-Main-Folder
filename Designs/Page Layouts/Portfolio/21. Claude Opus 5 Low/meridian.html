<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Meridian — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06080b; --bg2:#0a0e13; --panel:#0d1219; --panel2:#111823;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#e8edf4; --tx2:#8c97a8; --tx3:#59646f;
  --up:#35d6a4; --dn:#ff5f6d; --gold:#e8b84b; --cy:#57d0ea; --vi:#9b8cff;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body:before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(232,184,75,.09), transparent 60%),
    radial-gradient(800px 600px at 92% 0%, rgba(87,208,234,.07), transparent 60%),
    radial-gradient(700px 700px at 60% 110%, rgba(155,140,255,.06), transparent 60%);
}
body:after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse 100% 80% at 50% 0%,#000,transparent 75%);
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .dn{color:var(--dn)}
::selection{background:rgba(232,184,75,.3)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#1d2632;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ───── rail ───── */
#rail{position:fixed;left:0;top:0;bottom:0;width:62px;z-index:40;
  background:linear-gradient(180deg,#0a0e14,#070a0e);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;margin-bottom:16px;
  background:linear-gradient(145deg,#e8b84b,#a8761a);box-shadow:0 0 22px rgba(232,184,75,.35)}
.logo svg{width:20px;height:20px}
.rl{width:40px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--tx3);cursor:pointer;position:relative;transition:.18s}
.rl:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.rl.on{color:#06080b;background:linear-gradient(145deg,#f0c964,#d9a534)}
.rl.on:after{content:'';position:absolute;left:-12px;top:9px;width:3px;height:20px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.rl svg{width:18px;height:18px}
.tip{position:absolute;left:52px;background:#161e29;border:1px solid var(--line2);padding:5px 9px;border-radius:7px;
  font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-6px);transition:.15s;color:var(--tx);z-index:60}
.rl:hover .tip{opacity:1;transform:none}

/* ───── shell ───── */
#shell{margin-left:62px;position:relative;z-index:1;min-height:100vh}
header#top{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px);
  background:linear-gradient(180deg,rgba(6,8,11,.94),rgba(6,8,11,.78));border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:22px;padding:13px 26px 11px}
.crumb{font-size:11px;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase}
.crumb b{color:var(--tx);font-weight:600}
.hval{display:flex;align-items:baseline;gap:10px;margin-left:auto}
.hval .v{font-size:19px;font-weight:600;letter-spacing:-.5px}
.pill{padding:3px 8px;border-radius:99px;font-size:11.5px;font-weight:600;font-family:'JetBrains Mono',monospace}
.pill.p{background:rgba(53,214,164,.13);color:var(--up)} .pill.n{background:rgba(255,95,109,.13);color:var(--dn)}
.live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
.dot{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
nav#tabs{display:flex;gap:2px;padding:0 26px}
.tab{padding:9px 15px 12px;font-size:12.5px;color:var(--tx2);cursor:pointer;position:relative;font-weight:500;letter-spacing:.02em;transition:.15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx)}
.tab.on:after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),#f3d489);box-shadow:0 0 14px rgba(232,184,75,.6)}
main{padding:20px 26px 70px;max-width:1560px}

/* ───── panels ───── */
.grid{display:grid;gap:14px}
.card{background:linear-gradient(170deg,rgba(21,28,38,.75),rgba(10,14,19,.85));border:1px solid var(--line);
  border-radius:var(--r);position:relative;overflow:hidden}
.card:before{content:'';position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent)}
.ch{display:flex;align-items:center;gap:9px;padding:12px 15px 0}
.ct{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--tx2);font-weight:600}
.cs{font-size:10.5px;color:var(--tx3);margin-left:auto}
.cb{padding:12px 15px 15px}
.seg{display:flex;gap:1px;background:rgba(255,255,255,.05);border-radius:8px;padding:2px;margin-left:auto}
.seg span{padding:3px 9px;border-radius:6px;font-size:10.5px;color:var(--tx2);cursor:pointer;transition:.15s;font-weight:500}
.seg span.on{background:rgba(255,255,255,.1);color:var(--tx)}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.big{font-size:26px;font-weight:600;letter-spacing:-1px}
.hr{height:1px;background:var(--line);margin:11px 0}
.tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:2.5px 7px;border-radius:5px;
  border:1px solid var(--line2);color:var(--tx2)}
.bar{height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--gold);transition:width .8s cubic-bezier(.2,.8,.2,1)}

table{width:100%;border-collapse:collapse}
th{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3);font-weight:600;
  text-align:right;padding:7px 9px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th:hover{color:var(--tx)}
th.srt{color:var(--gold)}
td{padding:8px 9px;text-align:right;border-bottom:1px solid rgba(255,255,255,.035);font-size:12px}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:hover{background:rgba(255,255,255,.04)}
.tk{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:12px}
.nm{font-size:10.5px;color:var(--tx3);margin-top:1px}

#tip{position:fixed;z-index:99;pointer-events:none;opacity:0;transition:opacity .12s;
  background:rgba(12,17,24,.97);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;
  font-size:11.5px;box-shadow:0 14px 40px rgba(0,0,0,.6);backdrop-filter:blur(8px);max-width:260px}
#tip b{font-size:12.5px}
.fade{animation:fade .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.sub{display:flex;gap:6px;margin:0 0 16px;flex-wrap:wrap}
.sb{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:11.5px;color:var(--tx2);cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
.sb:hover{color:var(--tx);border-color:var(--line2)}
.sb.on{color:#06080b;background:linear-gradient(145deg,#f0c964,#dba832);border-color:transparent;font-weight:600}
.kpi{padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.028);border:1px solid var(--line)}
.kpi .n{font-size:19px;font-weight:600;letter-spacing:-.4px;margin-top:5px}
.flag{font-size:13px}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--gold);cursor:pointer;box-shadow:0 0 0 4px rgba(232,184,75,.18)}
</style>
</head>

<div id="tip"></div>
<aside id="rail">

  <div class="rl" data-n="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="8" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/></svg><span class="tip">Dashboard</span></div>

<div id="shell">
  <header id="top">

      <div class="crumb">Meridian <span style="opacity:.4">/</span> <b>Portfolio</b></div>

<script>
/* ══════════════ DATA ══════════════ */
const H=[
 // tk, name, sector, region, country, flag, shares, price, cost, day%, ytd%, beta, pe, dy, lat, lon
 ['NVDA','NVIDIA','Technology','N. America','United States','🇺🇸',420,131.4,58.2,2.31,68.4,1.72,48.2,0.03,37.37,-121.96],
 ['MSFT','Microsoft','Technology','N. America','United States','🇺🇸',330,441.6,289.1,0.42,17.2,0.91,34.1,0.72,47.64,-122.13],

 ['TSM','TSMC','Technology','Asia-Pac','Taiwan','🇹🇼',760,188.9,101.4,1.85,41.3,1.18,26.4,1.28,24.77,121.0],
 ['UNH','UnitedHealth','Healthcare','N. America','United States','🇺🇸',150,512.8,478.2,-0.38,-2.1,0.63,17.9,1.52,44.97,-93.27],

 ['JPM','JPMorgan Chase','Financials','N. America','United States','🇺🇸',290,241.5,158.9,0.71,23.7,1.09,13.2,2.05,40.75,-73.98],
 ['V','Visa','Financials','N. America','United States','🇺🇸',210,308.4,232.1,0.19,12.4,0.94,30.1,0.74,37.79,-122.4],
 ['LVMH','LVMH','Cons. Disc.','Europe','France','🇫🇷',105,648.0,712.4,-0.92,-9.4,1.24,22.6,2.18,48.87,2.31],

 ['NESN','Nestlé','Cons. Staples','Europe','Switzerland','🇨🇭',620,82.4,97.1,-0.44,-11.2,0.51,17.4,3.42,46.50,6.67],

 ['EQNR','Equinor','Energy','Europe','Norway','🇳🇴',900,26.1,29.8,0.88,-5.2,0.95,8.4,5.62,58.97,5.73],
 ['CAT','Caterpillar','Industrials','N. America','United States','🇺🇸',110,392.7,281.5,-0.61,11.6,1.08,17.1,1.44,40.09,-88.24],
 ['SIE','Siemens','Industrials','Europe','Germany','🇩🇪',240,186.4,152.3,0.24,9.1,1.16,19.2,2.62,48.14,11.58],
 ['BHP','BHP Group','Materials','Asia-Pac','Australia','🇦🇺',1400,52.8,58.4,-1.32,-8.7,1.02,11.6,5.14,-37.82,144.96],
 ['SE','Sea Limited','Technology','Asia-Pac','Singapore','🇸🇬',430,104.3,61.7,3.12,52.1,1.94,71.2,0,1.29,103.85],
 ['MELI','MercadoLibre','Cons. Disc.','LatAm','Argentina','🇦🇷',48,1842.0,1310.0,1.67,31.2,1.48,54.3,0,-34.60,-58.38],
 ['SHOP','Shopify','Technology','N. America','Canada','🇨🇦',520,108.6,72.9,2.04,34.8,2.11,68.9,0,43.65,-79.38],
].map(a=>{const o={tk:a[0],name:a[1],sec:a[2],reg:a[3],ctry:a[4],flag:a[5],sh:a[6],px:a[7],cost:a[8],d:a[9],ytd:a[10],beta:a[11],pe:a[12],dy:a[13],lat:a[14],lon:a[15]};
 o.val=o.sh*o.px; o.cb=o.sh*o.cost; o.pl=o.val-o.cb; o.plp=(o.px/o.cost-1)*100; o.dval=o.val*o.d/100; return o;});
const CASH=182400;
const TOTV=H.reduce((s,h)=>s+h.val,0)+CASH;
H.forEach(h=>h.w=h.val/TOTV*100);
const DAYPL=H.reduce((s,h)=>s+h.dval,0);
const TOTPL=H.reduce((s,h)=>s+h.pl,0);
const SECC={'Technology':'#57d0ea','Healthcare':'#35d6a4','Financials':'#e8b84b','Cons. Disc.':'#9b8cff','Cons. Staples':'#f08fb4','Energy':'#ff9b54','Industrials':'#6ea8fe','Materials':'#8fd14f','Cash':'#4a5866'};
const REGC={'N. America':'#e8b84b','Europe':'#57d0ea','Asia-Pac':'#9b8cff','LatAm':'#35d6a4'};

/* deterministic pseudo-random */
let _s=42; const rnd=()=>{_s=(_s*1103515245+12345)%2147483648;return _s/2147483648};
// equity curve, 3y daily-ish (750 pts)
const EQ=[],BM=[];{let v=100,b=100;for(let i=0;i<756;i++){const t=i/756;
 const drift=.00072+.0004*Math.sin(t*7), sh=(rnd()-.5)*.019-(t>.55&&t<.66?.0038:0)+(t>.8?.0008:0);
 v*=1+drift+sh; b*=1+.00048+ (rnd()-.5)*.013 - (t>.55&&t<.66?.0026:0);
 EQ.push(v);BM.push(b);} }
const NAVSERIES=EQ.map(v=>v/EQ[EQ.length-1]*TOTV);
// monthly returns matrix 3y
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MR=[2023,2024,2025].map((y,yi)=>MONTHS.map((m,mi)=>{const k=yi*12+mi;const seg=EQ.slice(Math.floor(k*21),Math.floor((k+1)*21)+1);
 return seg.length>1?(seg[seg.length-1]/seg[0]-1)*100:null;}));

const EVENTS=[
 {d:'Feb 04',t:'NVDA',k:'Earnings',n:'Q4 FY25 results, after close',imp:3,w:H.find(h=>h.tk==='NVDA').w},
 {d:'Feb 06',t:'MSFT',k:'Ex-Dividend',n:'$0.83 per share',imp:1,w:H.find(h=>h.tk==='MSFT').w},
 {d:'Feb 07',t:'MACRO',k:'US CPI',n:'Jan print · cons. 2.9% y/y',imp:3,w:0},
 {d:'Feb 11',t:'ASML',k:'Investor Day',n:'2030 targets update',imp:2,w:H.find(h=>h.tk==='ASML').w},
 {d:'Feb 13',t:'NOVO',k:'Earnings',n:'FY guidance in focus',imp:3,w:H.find(h=>h.tk==='NOVO').w},
 {d:'Feb 18',t:'BHP',k:'Half-year',n:'Interim dividend decision',imp:2,w:H.find(h=>h.tk==='BHP').w},
 {d:'Feb 20',t:'MACRO',k:'FOMC Minutes',n:'Jan meeting',imp:2,w:0},
 {d:'Feb 25',t:'LVMH',k:'Ex-Dividend',n:'€7.50 per share',imp:1,w:H.find(h=>h.tk==='LVMH').w},
];
const NEWS=[
 {t:'Taiwan foundry pricing to rise ~8% on advanced nodes in 2026',src:'Nikkei',ago:'18m',sent:1,hits:['TSM','NVDA','ASML'],exp:0,note:'Margin tailwind for TSM; input cost risk for NVDA.'},
 {t:'EU opens antitrust probe into luxury retail distribution deals',src:'Reuters',ago:'1h',sent:-1,hits:['LVMH'],exp:0,note:'Headline risk only — no revenue at stake near-term.'},
 {t:'GLP-1 supply constraints easing faster than guided, says analyst',src:'Bloomberg',ago:'2h',sent:1,hits:['NOVO'],exp:0,note:'Volume upside vs. consensus into Feb 13 print.'},
 {t:'US Treasury 10y yield breaks 4.6% on hot services data',src:'FT',ago:'3h',sent:-1,hits:['SHOP','SE','MELI'],exp:0,note:'Long-duration growth names carry highest rate beta here.'},
 {t:'Iron ore futures slide 4% as China steel output curbs extend',src:'Reuters',ago:'5h',sent:-1,hits:['BHP'],exp:0,note:'~64% of BHP EBITDA is iron ore.'},
];
NEWS.forEach(n=>n.exp=n.hits.reduce((s,t)=>{const h=H.find(x=>x.tk===t);return s+(h?h.w:0)},0));

/* ══════════════ UTILS ══════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fm=n=>'$'+Math.round(n).toLocaleString();
const fmc=n=>{const a=Math.abs(n);return (n<0?'-$':'$')+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'k':a.toFixed(0))};
const pc=(n,d=2)=>(n>=0?'+':'')+n.toFixed(d)+'%';
const cls=n=>n>=0?'up':'dn';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const lerp=(a,b,t)=>a+(b-a)*t;
function path(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}
function smooth(pts){if(pts.length<3)return path(pts);let d='M'+pts[0][0]+' '+pts[0][1];
 for(let i=0;i<pts.length-1;i++){const p0=pts[i],p1=pts[i+1];const cx=(p0[0]+p1[0])/2;
  d+=`C${cx} ${p0[1]},${cx} ${p1[1]},${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`}return d}
function scale(arr,w,h,pad=0){const mn=Math.min(...arr),mx=Math.max(...arr),r=(mx-mn)||1;
 return arr.map((v,i)=>[i/(arr.length-1)*w,h-pad-(v-mn)/r*(h-pad*2)])}
/* tooltip */
const TIP=$('#tip');
function tipOn(e,html){TIP.innerHTML=html;TIP.style.opacity=1;tipMove(e)}
function tipMove(e){const r=TIP.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
 if(x+r.width>innerWidth-10)x=e.clientX-r.width-14; if(y+r.height>innerHeight-10)y=e.clientY-r.height-14;
 TIP.style.left=x+'px';TIP.style.top=y+'px'}
function tipOff(){TIP.style.opacity=0}
function bindTip(el,html){el.addEventListener('mouseenter',e=>tipOn(e,typeof html==='function'?html():html));
 el.addEventListener('mousemove',tipMove);el.addEventListener('mouseleave',tipOff)}
function svg(w,h,inner,extra=''){return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%" preserveAspectRatio="none" ${extra}>${inner}</svg>`}
function card(title,sub,body,style=''){return `<section class="card" style="${style}">
  <div class="ch"><div class="ct">${title}</div>${sub?`<div class="cs">${sub}</div>`:''}</div><div class="cb">${body}</div></section>`}
</script>

 for(let k=0;k<40;k++){v*=1+h.ytd/100/60+(r()-.5)*.035;a.push(v)}MS[h.tk]=a});
function spark(tk,w=64,hh=20,col){const a=MS[tk],p=scale(a,w,hh,2),up=a[a.length-1]>=a[0];
 return `<svg width="${w}" height="${hh}" style="display:block"><path d="${smooth(p)}" fill="none" stroke="${col||(up?'var(--up)':'var(--dn)')}" stroke-width="1.4" stroke-linejoin="round"/></svg>`}

 const all=[...en,...bn],mn=Math.min(...all),mx=Math.max(...all),pad=(mx-mn)*.12;
 const y=v=>Hh-14-((v-mn+pad)/((mx-mn)+pad*2))*(Hh-30);
 const x=i=>i/(en.length-1)*W;
 const pe=en.map((v,i)=>[x(i),y(v)]),pb=bn.map((v,i)=>[x(i),y(v)]);
 const grid=[0,.25,.5,.75,1].map(t=>{const v=mn-pad+t*((mx-mn)+pad*2);

   <text x="4" y="${y(v)-4}" fill="#59646f" font-size="9" font-family="JetBrains Mono">${v.toFixed(0)}</text>`}).join('');
 const ret=(en[en.length-1]-100),bret=(bn[bn.length-1]-100);
 return `<div style="position:relative">

function allocData(mode){

 return a}
function donut(){
 const a=allocData(allocMode),S=210,R=88,r0=60;let ang=-Math.PI/2,seg='';
 a.forEach((d,i)=>{const sw=d.p/100*2*Math.PI,e=ang+sw-.012;
  const p=(rad,t)=>[S/2+Math.cos(t)*rad,S/2+Math.sin(t)*rad];
  const [x1,y1]=p(R,ang),[x2,y2]=p(R,e),[x3,y3]=p(r0,e),[x4,y4]=p(r0,ang);
  const la=sw>Math.PI?1:0;
  seg+=`<path class="dseg" data-i="${i}" d="M${x1} ${y1}A${R} ${R} 0 ${la} 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 ${la} 0 ${x4} ${y4}Z"
   fill="${d.c}" opacity=".88" style="transform-origin:${S/2}px ${S/2}px;transition:.2s;cursor:pointer"/>`;ang+=sw});
 const legend=a.map((d,i)=>`<div class="lgi" data-i="${i}" style="display:flex;align-items:center;gap:7px;padding:3.5px 0;cursor:pointer">
   <i style="width:7px;height:7px;border-radius:2px;background:${d.c};flex:none"></i>

 return `<div style="display:flex;gap:10px;align-items:center">

<script>
/* ══ SQUARIFIED TREEMAP ══ */
function squarify(items,x,y,w,h){
 const out=[];const tot=items.reduce((s,i)=>s+i.v,0);let list=items.map(i=>({...i,a:i.v/tot*w*h}));
 function worst(row,len){const s=row.reduce((a,b)=>a+b.a,0),mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a));
  return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn))}
 function layout(row,len,horiz,cx,cy,cw,ch){const s=row.reduce((a,b)=>a+b.a,0);
  if(horiz){const rh=s/len;let px=cx;row.forEach(r=>{const rw=r.a/rh;out.push({...r,x:px,y:cy,w:rw,h:rh});px+=rw});return [cx,cy+rh,cw,ch-rh]}
  else{const rw=s/len;let py=cy;row.forEach(r=>{const rh=r.a/rw;out.push({...r,x:cx,y:py,w:rw,h:rh});py+=rh});return [cx+rw,cy,cw-rw,ch]}}
 let cx=x,cy=y,cw=w,ch=h,row=[];
 while(list.length){const horiz=cw>=ch,len=horiz?cw:ch;const it=list[0];
  if(!row.length||worst([...row,it],len)<=worst(row,len)){row.push(it);list.shift();}
  else{[cx,cy,cw,ch]=layout(row,len,horiz,cx,cy,cw,ch);row=[]}}
 if(row.length)layout(row,(cw>=ch?cw:ch),cw>=ch,cx,cy,cw,ch);
 return out}

let tmMode='val';
function treemap(){
 const W=1000,Hh=440;
 const secs={};H.forEach(h=>{(secs[h.sec]=secs[h.sec]||[]).push(h)});
 const groups=Object.entries(secs).map(([k,v])=>({k,v:v.reduce((s,h)=>s+h.val,0),items:v})).sort((a,b)=>b.v-a.v);
 const cells=squarify(groups,0,0,W,Hh);let out='';
 cells.forEach(g=>{
  out+=`<rect x="${g.x}" y="${g.y}" width="${g.w}" height="${g.h}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.6"/>`;
  const inner=squarify(g.items.map(h=>({...h,v:h.val})).sort((a,b)=>b.v-a.v),g.x+1.5,g.y+16,g.w-3,g.h-18);
  out+=`<text x="${g.x+7}" y="${g.y+12}" fill="#8c97a8" font-size="9.5" letter-spacing="1.3" font-weight="600">${g.k.toUpperCase()}</text>`;
  inner.forEach(c=>{
   const m=tmMode==='val'?c.d:tmMode==='ytd'?c.ytd/6:c.plp/8;
   const t=Math.max(-1,Math.min(1,m/2.2));

/* ══ GLOBE (canvas, orthographic, animated) ══ */
const LAND=[[48,72,-168,-62],[60,72,-168,-130],[30,49,-125,-70],[25,31,-106,-80],[15,30,-107,-88],[8,17,-90,-77],
 [60,82,-52,-22],[-4,12,-79,-50],[-20,-4,-75,-35],[-35,-20,-71,-45],[-53,-35,-74,-60],
 [36,60,-9,30],[54,70,5,32],[40,52,20,48],[10,35,-16,32],[-10,12,-12,44],[-28,-10,12,38],[-34,-28,17,32],[-25,-12,43,50],
 [12,32,35,60],[50,70,30,180],[35,52,45,92],[20,36,70,122],[8,20,72,82],[0,20,95,110],[30,45,126,143],[-10,6,95,141],
 [-38,-12,113,153],[-46,-35,166,179],[-90,-72,-180,180]];
function isLand(la,lo){for(const b of LAND)if(la>=b[0]&&la<=b[1]&&lo>=b[2]&&lo<=b[3])return 1;return 0}
const DOTS=[];for(let la=-88;la<=88;la+=3.2){for(let lo=-180;lo<180;lo+=3.2){if(isLand(la,lo))DOTS.push([la,lo])}}
const REGSUM={};H.forEach(h=>{const k=h.ctry;if(!REGSUM[k])REGSUM[k]={v:0,lat:h.lat,lon:h.lon,n:[],flag:h.flag};REGSUM[k].v+=h.val;REGSUM[k].n.push(h.tk)});
let globeRot=0,globeRAF=null,globeDrag=null;
function drawGlobe(cv){
 const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1,S=cv.clientWidth,Hh=cv.clientHeight;
 cv.width=S*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,S,Hh);
 const cx=S/2,cy=Hh/2,R=Math.min(S,Hh)/2-14,rad=Math.PI/180,tilt=17*rad;
 const g=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.1,cx,cy,R);
 g.addColorStop(0,'rgba(30,44,60,.85)');g.addColorStop(1,'rgba(8,12,17,.95)');
 ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=g;ctx.fill();
 ctx.strokeStyle='rgba(232,184,75,.28)';ctx.lineWidth=1;ctx.stroke();
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.clip();
 // graticule
 ctx.strokeStyle='rgba(255,255,255,.045)';
 for(let la=-60;la<=60;la+=30){const r=R*Math.cos(la*rad),yy=cy-R*Math.sin(la*rad)*Math.cos(tilt);
   ctx.beginPath();ctx.ellipse(cx,yy,r,r*Math.sin(tilt)||1,0,0,7);ctx.stroke()}
 const proj=(la,lo)=>{const p=la*rad,l=(lo+globeRot)*rad;
   let x=Math.cos(p)*Math.sin(l),y=Math.sin(p),z=Math.cos(p)*Math.cos(l);
   const y2=y*Math.cos(tilt)-z*Math.sin(tilt),z2=y*Math.sin(tilt)+z*Math.cos(tilt);
   return [cx+x*R,cy-y2*R,z2]};
 DOTS.forEach(([la,lo])=>{const [x,y,z]=proj(la,lo);if(z<=0)return;
  const a=.12+z*.5;ctx.fillStyle=`rgba(150,175,200,${a})`;ctx.beginPath();ctx.arc(x,y,1.25,0,7);ctx.fill()});
 // arcs between holdings hubs and a "home" node (portfolio base = NY)
 const home=[40.7,-74];
 Object.values(REGSUM).forEach(r=>{const A=proj(home[0],home[1]),B=proj(r.lat,r.lon);
  if(A[2]<=0&&B[2]<=0)return;
  const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy)||1;
  const lift=1+ Math.hypot(B[0]-A[0],B[1]-A[1])/(R*2.4);
  ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.quadraticCurveTo(cx+dx/d*d*lift*1.15,cy+dy/d*d*lift*1.15,B[0],B[1]);
  ctx.strokeStyle=`rgba(232,184,75,${.06+.18*Math.max(A[2],B[2])})`;ctx.lineWidth=.9;ctx.stroke()});
 // markers
 const t=performance.now()/1000;
 Object.entries(REGSUM).forEach(([k,r])=>{const [x,y,z]=proj(r.lat,r.lon);if(z<=0)return;
  const sz=4+Math.sqrt(r.v/TOTV)*22;const pulse=(t*.55+r.lat)%1;
  ctx.beginPath();ctx.arc(x,y,sz*(1+pulse*1.5),0,7);ctx.strokeStyle=`rgba(232,184,75,${(1-pulse)*.35*z})`;ctx.lineWidth=1;ctx.stroke();
  const gg=ctx.createRadialGradient(x,y,0,x,y,sz);gg.addColorStop(0,`rgba(255,226,150,${.95*z})`);gg.addColorStop(1,`rgba(232,184,75,${.15*z})`);
  ctx.beginPath();ctx.arc(x,y,sz,0,7);ctx.fillStyle=gg;ctx.fill();
  r._x=x;r._y=y;r._z=z;r._r=sz});
 ctx.restore();
 // atmosphere
 const ag=ctx.createRadialGradient(cx,cy,R*.9,cx,cy,R*1.16);
 ag.addColorStop(0,'rgba(87,208,234,.14)');ag.addColorStop(1,'rgba(87,208,234,0)');
 ctx.beginPath();ctx.arc(cx,cy,R*1.16,0,7);ctx.fillStyle=ag;ctx.fill();
}
function startGlobe(){
 const cv=$('#globe');if(!cv)return;
 const loop=()=>{if(!document.body.contains(cv)){globeRAF=null;return}
  if(!globeDrag)globeRot+=.16; drawGlobe(cv); globeRAF=requestAnimationFrame(loop)};
 cancelAnimationFrame(globeRAF);loop();
 cv.onmousedown=e=>{globeDrag={x:e.clientX,r:globeRot}};
 addEventListener('mouseup',()=>globeDrag=null);
 cv.onmousemove=e=>{
  if(globeDrag){globeRot=globeDrag.r+(e.clientX-globeDrag.x)*.4;return}
  const b=cv.getBoundingClientRect(),mx=e.clientX-b.left,my=e.clientY-b.top;
  const hit=Object.entries(REGSUM).find(([k,r])=>r._z>0&&Math.hypot(r._x-mx,r._y-my)<r._r+4);
  if(hit){const [k,r]=hit;cv.style.cursor='pointer';
   tipOn(e,`<b>${r.flag} ${k}</b><div style="color:var(--tx2);margin-top:3px">${fmc(r.v)} · ${(r.v/TOTV*100).toFixed(1)}% of NAV</div>
   <div style="margin-top:4px;font-size:10.5px;color:var(--tx3)">${r.n.join(' · ')}</div>`)}
  else{cv.style.cursor='grab';tipOff()}};
 cv.onmouseleave=()=>tipOff();
}

     <div style="margin-top:9px;font-size:10.8px;color:var(--tx3)">Domicile-weighted. Revenue-weighted exposure differs: <b style="color:var(--tx2)">US 46% · China 18% · EU 21%</b>.</div>`,

<script>
/* ══ WATERFALL ══ */
const WF=[['Opening NAV',0,'base'],['Price return',+1284000,''],['Dividends',+96400,''],['FX translation',-142000,''],
 ['Net contributions',+250000,''],['Fees & tax',-38600,''],['Closing NAV',0,'end']];
function waterfall(){
 const W=880,Hh=230,open=TOTV-(1284000+96400-142000+250000-38600);
 let run=open;const pts=[];
 WF.forEach((w,i)=>{if(w[2]==='base'){pts.push({l:w[0],v:open,s:open,e:open,t:'tot'})}
  else if(w[2]==='end'){pts.push({l:w[0],v:run,s:0,e:run,t:'tot'})}
  else{pts.push({l:w[0],v:w[1],s:run,e:run+w[1],t:w[1]>0?'p':'n'});run+=w[1]}});
 const mx=Math.max(...pts.map(p=>Math.max(p.s,p.e)))*1.05,mn=Math.min(...pts.map(p=>Math.min(p.s,p.e)))*.94;
 const y=v=>Hh-24-((v-mn)/(mx-mn))*(Hh-46);
 const bw=W/pts.length*.56,gap=W/pts.length;
 let s='';pts.forEach((p,i)=>{const x=i*gap+(gap-bw)/2;
  const y1=y(Math.max(p.s,p.e)),y2=y(Math.min(p.s,p.e));
  const col=p.t==='tot'?'#e8b84b':p.t==='p'?'#35d6a4':'#ff5f6d';
  const hgt=p.t==='tot'?y(mn)-y(p.e):Math.max(2,y2-y1);
  const yy=p.t==='tot'?y(p.e):y1;
  s+=`<rect x="${x}" y="${yy}" width="${bw}" height="${hgt}" rx="2.5" fill="${col}" opacity="${p.t==='tot'?.85:.72}"/>`;
  if(i<pts.length-1)s+=`<line x1="${x}" x2="${x+gap}" y1="${y(p.e)}" y2="${y(p.e)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 3"/>`;
  s+=`<text x="${x+bw/2}" y="${yy-7}" text-anchor="middle" font-size="10.5" font-family="JetBrains Mono" fill="${p.t==='tot'?'#e8edf4':col}">${p.t==='tot'?fmc(p.e):(p.v>0?'+':'')+fmc(p.v)}</text>`;
  s+=`<text x="${x+bw/2}" y="${Hh-7}" text-anchor="middle" font-size="9.6" fill="#8c97a8">${p.l}</text>`});
 return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="230">${s}</svg>`}

/* ══ RETURN DISTRIBUTION ══ */
function distribution(){
 const r=[];for(let i=1;i<EQ.length;i++)r.push((EQ[i]/EQ[i-1]-1)*100);
 const bins=27,mn=-3.2,mx=3.2,c=new Array(bins).fill(0);
 r.forEach(v=>{const b=Math.floor((Math.max(mn,Math.min(mx-.001,v))-mn)/(mx-mn)*bins);c[b]++});
 const W=470,Hh=170,mxc=Math.max(...c);
 const mean=r.reduce((a,b)=>a+b,0)/r.length;
 const sd=Math.sqrt(r.reduce((a,b)=>a+(b-mean)**2,0)/r.length);
 const sorted=[...r].sort((a,b)=>a-b),var95=sorted[Math.floor(r.length*.05)];
 let s='';c.forEach((v,i)=>{const x=i/bins*W,w=W/bins-2,h=v/mxc*(Hh-40),bv=mn+(i+.5)/bins*(mx-mn);
  const col=bv<var95?'#ff5f6d':bv<0?'rgba(255,95,109,.45)':'rgba(53,214,164,.55)';
  s+=`<rect x="${x}" y="${Hh-22-h}" width="${w}" height="${h}" rx="2" fill="${col}"/>`});
 const xo=v=>(v-mn)/(mx-mn)*W;
 s+=`<line x1="${xo(var95)}" x2="${xo(var95)}" y1="6" y2="${Hh-22}" stroke="#ff5f6d" stroke-dasharray="3 3"/>
  <text x="${xo(var95)-4}" y="16" text-anchor="end" fill="#ff5f6d" font-size="10" font-family="JetBrains Mono">VaR₉₅ ${var95.toFixed(2)}%</text>
  <line x1="${xo(mean)}" x2="${xo(mean)}" y1="6" y2="${Hh-22}" stroke="#e8b84b" opacity=".7"/>
  <text x="${xo(mean)+5}" y="16" fill="#e8b84b" font-size="10" font-family="JetBrains Mono">μ ${mean.toFixed(2)}%</text>`;
 [-3,-2,-1,0,1,2,3].forEach(v=>{s+=`<text x="${xo(v)}" y="${Hh-6}" text-anchor="middle" fill="#59646f" font-size="9" font-family="JetBrains Mono">${v}%</text>`});
 return {svg:`<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="170">${s}</svg>`,sd,mean,var95,
  pos:(r.filter(v=>v>0).length/r.length*100)}}

 let g='';
 for(let v=10;v<=70;v+=20)g+=`<line x1="${X(v)}" x2="${X(v)}" y1="10" y2="${Hh-pad}" stroke="rgba(255,255,255,.05)"/><text x="${X(v)}" y="${Hh-pad+14}" text-anchor="middle" font-size="9.5" fill="#59646f" font-family="JetBrains Mono">${v}x</text>`;
 for(let v=10;v<=40;v+=10)g+=`<line x1="${pad}" x2="${W-14}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.05)"/><text x="${pad-7}" y="${Y(v)+3}" text-anchor="end" font-size="9.5" fill="#59646f" font-family="JetBrains Mono">${v}%</text>`;
 // fair value diagonal (PEG=1.5)
 g+=`<path d="M${X(15)} ${Y(10)} L${X(67.5)} ${Y(45)}" stroke="rgba(232,184,75,.35)" stroke-dasharray="5 4"/>
  <text x="${X(58)}" y="${Y(43)}" font-size="9.5" fill="rgba(232,184,75,.7)">PEG ≈ 1.5</text>`;
 H.forEach(h=>{const x=X(Math.min(72,h.pe)),y=Y(gr(h)),r=4+Math.sqrt(h.w)*4.4;
  g+=`<circle class="vb" data-tk="${h.tk}" cx="${x}" cy="${y}" r="${r}" fill="${SECC[h.sec]}" opacity=".6" stroke="${SECC[h.sec]}" stroke-width="1.3" style="cursor:pointer"/>
   ${h.w>4.5?`<text x="${x}" y="${y+3}" text-anchor="middle" font-size="8.5" font-family="JetBrains Mono" fill="#06080b" font-weight="700">${h.tk}</text>`:''}`});
 g+=`<text x="${W/2}" y="${Hh-6}" text-anchor="middle" font-size="9.5" fill="#59646f">forward P/E →</text>
  <text x="12" y="${Hh/2}" text-anchor="middle" font-size="9.5" fill="#59646f" transform="rotate(-90 12 ${Hh/2})">est. earnings growth →</text>`;
 return `<svg viewBox="0 0 ${W} ${Hh}" width="100%">${g}</svg>
  <div style="font-size:11px;color:var(--tx3);margin-top:4px">Bubble size = portfolio weight. Above the dashed line = growth you are <b style="color:var(--up)">not</b> overpaying for; below = priced for perfection.</div>`}

/* ══ PAGE: ANALYSIS ══ */
function pageAnalysis(){
 return `<div class="sub"><span class="sb" data-go="overview">Overview</span><span class="sb" data-go="holdings">Holdings</span>
  <span class="sb" data-go="performance">Performance</span><span class="sb on">Analysis</span>
  <span style="margin-left:auto;align-self:center;font-size:10.5px;color:var(--tx3)">Models refreshed nightly · 3y lookback</span></div>
 <div class="grid fade" style="grid-template-columns:repeat(12,1fr)">
  ${card('Scenario Lab','move the world, see your book',scenarioLab(),'grid-column:span 12')}
  ${card('Factor Exposure','vs MSCI ACWI',radar()+
    `<div style="font-size:11px;color:var(--tx3);line-height:1.5">You are long <b style="color:var(--gold)">growth + momentum</b> and short <b style="color:var(--tx2)">value</b>. In a value rotation this book underperforms even if every company delivers.</div>`,'grid-column:span 4')}
  ${card('Correlation','top 12 by value · 1y daily',matrix()+
    `<div style="display:flex;align-items:center;gap:8px;margin-top:6px">
      <span class="lbl">low</span><div style="flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,rgba(87,208,234,.2),rgba(232,184,75,.6),rgba(255,95,109,.9))"></div><span class="lbl">high</span></div>`,'grid-column:span 5')}
  ${card('Concentration','Lorenz curve',concentration(),'grid-column:span 3')}
  ${card('Hidden Overlap','one bet wearing many names',themes(),'grid-column:span 5')}
  ${card('Valuation Map','price vs growth',valuation(),'grid-column:span 7')}
  ${card('Income Engine','dividends, forward 12 months',income(),'grid-column:span 12')}
 </div>`}
</script>
<style>
#scrim{position:fixed;inset:0;background:rgba(3,5,8,.62);backdrop-filter:blur(3px);z-index:50;opacity:0;pointer-events:none;transition:.25s}
#scrim.on{opacity:1;pointer-events:auto}
#drw{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;z-index:51;overflow:auto;
 background:linear-gradient(180deg,#0e141c,#080b10);border-left:1px solid var(--line2);
 transform:translateX(102%);transition:transform .34s cubic-bezier(.3,.9,.3,1);box-shadow:-30px 0 70px rgba(0,0,0,.55)}
#drw.on{transform:none}
.dxc{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(255,255,255,.06);cursor:pointer;color:var(--tx2)}
.dxc:hover{color:var(--tx);background:rgba(255,255,255,.12)}
.st{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.045);font-size:12px}
.st span:first-child{color:var(--tx2)}
</style>
<div id="scrim"></div><aside id="drw"></aside>
<script>
/* ══ DRAWER ══ */
function openDrawer(tk){
 const h=H.find(x=>x.tk===tk);if(!h)return;
 const a=MS[tk],p=scale(a,380,110,6);
 const rel=NEWS.filter(n=>n.hits.includes(tk));
 const ev=EVENTS.filter(e=>e.t===tk);
 const S=SENS[tk]||[0,0,0,0,0];const sl=['Rates +100bp','USD +5%','Oil +10%','AI capex +10%','China +10%'];
 $('#drw').innerHTML=`
 <div style="padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,17,24,.93);backdrop-filter:blur(12px);z-index:2">
  <div style="display:flex;align-items:center;gap:10px">
   <span style="font-size:22px">${h.flag}</span>
   <div><div style="font-size:17px;font-weight:600;letter-spacing:-.3px">${h.tk}</div><div style="font-size:11px;color:var(--tx3)">${h.name} · ${h.ctry}</div></div>
   <div class="dxc" id="dx" style="margin-left:auto">✕</div></div>
  <div style="display:flex;align-items:baseline;gap:9px;margin-top:11px">
   <span class="mono" style="font-size:24px;font-weight:600">$${h.px.toFixed(2)}</span>
   <span class="pill ${h.d>=0?'p':'n'} mono">${pc(h.d)}</span>
   <span style="margin-left:auto" class="tag" style="border-color:${SECC[h.sec]}55;color:${SECC[h.sec]}">${h.sec}</span></div>
 </div>
 <div style="padding:14px 18px">
  <svg viewBox="0 0 380 110" width="100%" height="110">
   <defs><linearGradient id="dgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${h.ytd>=0?'#35d6a4':'#ff5f6d'}" stop-opacity=".3"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient></defs>
   <path d="${smooth(p)} L380 110 L0 110 Z" fill="url(#dgr)"/>
   <path d="${smooth(p)}" fill="none" stroke="${h.ytd>=0?'#35d6a4':'#ff5f6d'}" stroke-width="1.8"/></svg>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0">
   <div class="kpi"><div class="lbl">Market value</div><div class="n mono">${fmc(h.val)}</div><div style="font-size:10.5px;color:var(--tx3)">${h.w.toFixed(2)}% of NAV</div></div>
   <div class="kpi"><div class="lbl">Unrealised P/L</div><div class="n mono ${cls(h.pl)}">${fmc(h.pl)}</div><div class="mono ${cls(h.plp)}" style="font-size:10.5px">${pc(h.plp,1)}</div></div></div>
  <div class="st"><span>Shares</span><b class="mono">${h.sh.toLocaleString()}</b></div>
  <div class="st"><span>Average cost</span><b class="mono">$${h.cost.toFixed(2)}</b></div>
  <div class="st"><span>Day P/L</span><b class="mono ${cls(h.dval)}">${fmc(h.dval)}</b></div>
  <div class="st"><span>Contribution today</span><b class="mono ${cls(h.dval)}">${(h.dval/TOTV*1e4).toFixed(1)} bps</b></div>
  <div class="st"><span>Forward P/E</span><b class="mono">${h.pe.toFixed(1)}x</b></div>
  <div class="st"><span>Dividend yield</span><b class="mono">${h.dy?h.dy.toFixed(2)+'%':'—'}</b></div>
  <div class="st"><span>Beta (ACWI)</span><b class="mono">${h.beta.toFixed(2)}</b></div>
  <div class="st"><span>YTD</span><b class="mono ${cls(h.ytd)}">${pc(h.ytd,1)}</b></div>

  <div class="lbl" style="margin:16px 0 7px">Factor sensitivity</div>
  ${S.map((v,i)=>`<div style="display:grid;grid-template-columns:104px 1fr 42px;gap:8px;align-items:center;padding:2px 0">
    <span style="font-size:10.5px;color:var(--tx2)">${sl[i]}</span>
    <div style="position:relative;height:11px"><div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.1)"></div>
     <div style="position:absolute;top:2px;height:7px;border-radius:3px;${v>=0?`left:50%;width:${Math.abs(v)/15*49}%;background:#35d6a4`:`right:50%;width:${Math.abs(v)/15*49}%;background:#ff5f6d`};opacity:.8"></div></div>
    <span class="mono ${cls(v)}" style="font-size:10.5px;text-align:right">${v.toFixed(1)}%</span></div>`).join('')}

  ${ev.length?`<div class="lbl" style="margin:16px 0 7px">Upcoming</div>
   ${ev.map(e=>`<div style="padding:8px 10px;border-radius:9px;background:rgba(232,184,75,.08);border:1px solid rgba(232,184,75,.2);font-size:11.5px;margin-bottom:6px">
     <b>${e.d}</b> · ${e.k} — <span style="color:var(--tx2)">${e.n}</span></div>`).join('')}`:''}

  ${rel.length?`<div class="lbl" style="margin:16px 0 7px">Linked news</div>
   ${rel.map(n=>`<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.045)">
     <div style="font-size:11.8px;line-height:1.4">${n.t}</div>
     <div style="font-size:10.3px;color:var(--tx3);margin-top:3px">${n.src} · ${n.ago} · <span style="color:${n.sent>0?'var(--up)':'var(--dn)'}">${n.sent>0?'supportive':'adverse'}</span></div></div>`).join('')}`:''}
 </div>`;
 $('#drw').classList.add('on');$('#scrim').classList.add('on');
 $('#dx').onclick=closeDrawer}
function closeDrawer(){$('#drw').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* ══ ROUTER ══ */
const PAGES={overview:pageOverview,holdings:pageHoldings,performance:pagePerformance,analysis:pageAnalysis};
let page='overview';
function go(p){page=p;$('#view').innerHTML=PAGES[p]();
 $$('#tabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
 wire();scrollTo({top:0,behavior:'smooth'})}
$$('#tabs .tab').forEach(t=>t.onclick=()=>go(t.dataset.p));

function wire(){
 $$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 // rows / cells → drawer
 $$('[data-tk]').forEach(el=>{const tk=el.dataset.tk;
  el.addEventListener('click',()=>openDrawer(tk));
  const h=H.find(x=>x.tk===tk);if(!h)return;
  bindTip(el,()=>`<b>${h.flag} ${h.tk}</b> <span style="color:var(--tx3)">${h.name}</span>
   <div style="margin-top:4px;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:11px">
    <span style="color:var(--tx2)">Weight</span><b class="mono" style="text-align:right">${h.w.toFixed(2)}%</b>
    <span style="color:var(--tx2)">Value</span><b class="mono" style="text-align:right">${fmc(h.val)}</b>
    <span style="color:var(--tx2)">Today</span><b class="mono ${cls(h.d)}" style="text-align:right">${pc(h.d)}</b>
    <span style="color:var(--tx2)">All-time</span><b class="mono ${cls(h.plp)}" style="text-align:right">${pc(h.plp,1)}</b></div>
   <div style="margin-top:5px;font-size:10px;color:var(--tx3)">click for detail</div>`)});
 // range
 const rng=$('#rng');if(rng)$$('span',rng).forEach(s=>s.onclick=()=>{curRange=s.dataset.r;
   $$('span',rng).forEach(x=>x.classList.toggle('on',x===s));$('#eqwrap').innerHTML=equityChart(curRange)});
 // alloc mode
 const am=$('#almode');if(am)$$('span',am).forEach(s=>s.onclick=()=>{allocMode=s.dataset.m;
   $$('span',am).forEach(x=>x.classList.toggle('on',x===s));$('#dwrap').innerHTML=donut();wireDonut()});
 wireDonut();
 // health tips
 $$('.hmet').forEach(el=>bindTip(el,()=>el.dataset.d));
 // treemap mode
 const tm=$('#tmmode');if(tm)$$('span',tm).forEach(s=>s.onclick=()=>{tmMode=s.dataset.m;
   $$('span',tm).forEach(x=>x.classList.toggle('on',x===s));$('#tmwrap').innerHTML=treemap();wire()});
 // table sort
 $$('#tbl th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;
   if(sortK===k)sortD*=-1;else{sortK=k;sortD=(k==='tk'||k==='sec')?1:-1}
   $('#tbl').innerHTML=tableHTML();wire()});
 // heatmap cells
 $$('.hm').forEach(el=>bindTip(el,()=>`<b class="mono ${cls(+el.dataset.v)}">${pc(+el.dataset.v)}</b><div style="color:var(--tx3);font-size:10.5px">monthly return</div>`));
 // matrix
 $$('.mc').forEach(el=>bindTip(el,()=>`<b>${el.dataset.a} ↔ ${el.dataset.b}</b>
   <div class="mono" style="font-size:16px;margin-top:2px;color:${+el.dataset.v>.7?'var(--dn)':'var(--tx)'}">${el.dataset.v}</div>
   <div style="font-size:10.5px;color:var(--tx3)">${+el.dataset.v>.7?'moves as one position':+el.dataset.v>.45?'partially independent':'genuine diversification'}</div>`));
 // scenario
 if($('#scbars')){
  $$('.shk').forEach(i=>i.oninput=()=>{const s=SHOCKS.find(x=>x.k===i.dataset.k);s.v=+i.value;
    $('#sv-'+s.k).textContent=(s.v>0?'+':'')+s.v+s.u;scenarioRender()});
  $$('.prs').forEach(b=>b.onclick=()=>{const v=PRESETS[b.dataset.p];
    $$('.prs').forEach(x=>x.classList.toggle('on',x===b&&b.dataset.p!=='Reset'));
    SHOCKS.forEach((s,i)=>{s.v=v[i];const inp=$(`.shk[data-k="${s.k}"]`);inp.value=s.v;$('#sv-'+s.k).textContent=(s.v>0?'+':'')+s.v+s.u});
    scenarioRender()});
  scenarioRender()}
 // globe
 startGlobe();
 // equity crosshair
 const eq=$('#eqsvg');if(eq){const cross=$('#eqcross');
  eq.addEventListener('mousemove',e=>{const b=eq.getBoundingClientRect();const t=(e.clientX-b.left)/b.width;
   const n=Math.min(RANGES[curRange],EQ.length),i=Math.max(0,Math.min(n-1,Math.round(t*(n-1))));
   const es=EQ.slice(-n),bs=BM.slice(-n);const v=es[i]/es[0]*100,bv=bs[i]/bs[0]*100;
   cross.style.opacity=1;const X=t*900;
   $('#eqvl').setAttribute('x1',X);$('#eqvl').setAttribute('x2',X);
   const mn=Math.min(...es.map(x=>x/es[0]*100),...bs.map(x=>x/bs[0]*100)),mx=Math.max(...es.map(x=>x/es[0]*100),...bs.map(x=>x/bs[0]*100)),pad=(mx-mn)*.12;
   const y=q=>250-14-((q-mn+pad)/((mx-mn)+pad*2))*220;
   $('#eqd1').setAttribute('cx',X);$('#eqd1').setAttribute('cy',y(v));
   $('#eqd2').setAttribute('cx',X);$('#eqd2').setAttribute('cy',y(bv));
   const days=Math.round((n-1-i));
   tipOn(e,`<div style="font-size:10px;color:var(--tx3)">${days===0?'today':days+' trading days ago'}</div>
    <div style="margin-top:3px"><b class="mono">${fmc(es[i]/EQ[EQ.length-1]*TOTV)}</b></div>
    <div class="mono ${cls(v-100)}" style="font-size:11px">Portfolio ${pc(v-100)}</div>
    <div class="mono" style="font-size:11px;color:var(--tx2)">Benchmark ${pc(bv-100)}</div>`)});
  eq.addEventListener('mouseleave',()=>{cross.style.opacity=0;tipOff()})}
}
function wireDonut(){
 const a=allocData(allocMode);
 const set=(i)=>{const d=a[i];$('#dlbl').textContent=d.k;$('#dval').textContent=fmc(d.v);$('#dsub').textContent=d.p.toFixed(1)+'% of NAV'};
 const reset=()=>{$('#dlbl').textContent='Total';$('#dval').textContent=fmc(TOTV);$('#dsub').textContent=a.length+' groups'};
 $$('.dseg').forEach(s=>{s.onmouseenter=()=>{s.style.transform='scale(1.045)';s.style.opacity=1;set(+s.dataset.i)};
  s.onmouseleave=()=>{s.style.transform='';s.style.opacity='.88';reset()}});
 $$('.lgi').forEach(l=>{l.onmouseenter=()=>{set(+l.dataset.i);const s=$(`.dseg[data-i="${l.dataset.i}"]`);if(s){s.style.transform='scale(1.045)';s.style.opacity=1}};
  l.onmouseleave=()=>{reset();const s=$(`.dseg[data-i="${l.dataset.i}"]`);if(s){s.style.transform='';s.style.opacity='.88'}}});
}

/* ══ HEADER ══ */
(function header(){
 const dayp=DAYPL/(TOTV-DAYPL)*100;
 let shown=0;const target=TOTV;const t0=performance.now();
 const step=()=>{const k=Math.min(1,(performance.now()-t0)/1100);const e=1-Math.pow(1-k,3);
  $('#hv').textContent=fm(target*e);if(k<1)requestAnimationFrame(step)};step();
 const hp=$('#hp');hp.textContent=pc(dayp);hp.className='pill mono '+(dayp>=0?'p':'n');
 const s=EQ.slice(-60),p=scale(s,118,28,3);
 $('#hspark').innerHTML=`<path d="${smooth(p)}" fill="none" stroke="${dayp>=0?'#35d6a4':'#ff5f6d'}" stroke-width="1.5"/>`;
 const tick=()=>{const d=new Date();$('#clock').textContent=d.toTimeString().slice(0,8)};tick();setInterval(tick,1000);
})();
$$('#rail .rl').forEach(r=>r.onclick=()=>{if(r.dataset.n!=='Portfolio'){
  tipOn({clientX:innerWidth/2,clientY:70},`<b>${r.dataset.n}</b><div style="color:var(--tx3);font-size:11px">Module not part of this prototype</div>`);
  setTimeout(tipOff,1400)}});
go('overview');
</script>
